<meta charset="utf-8">
<title>교회공동체 관리시스템</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* ── 토큰 ───────────────────────────────────────────────── */
:root{
  --bg:#F6F5F2; --surface:#FFFFFF; --surface-2:#FBFAF7; --surface-3:#F1EFEA;
  --border:#E3E1DA; --border-strong:#CFCCC3;
  --ink:#1B1D21; --ink-2:#585B62; --ink-3:#8C8F97;
  --accent:#24446B; --accent-ink:#FFFFFF; --accent-soft:#E9EEF5; --accent-line:#B9C8DC;
  --brass:#A97B26; --brass-soft:#F5EEDD;
  --good:#2F7D4F; --good-soft:#E6F1EA;
  --warn:#9C6B10; --warn-soft:#F7EEDA;
  --crit:#AE362E; --crit-soft:#F8E8E6;
  --c1:#2E5FA3; --c2:#1E8F72; --c3:#C0761E; --c4:#B0406E; --c5:#7A6BC4; --c6:#D2622F;
  --grid:#EBE9E3;
  --shadow:0 1px 2px rgba(27,29,33,.05), 0 8px 24px -16px rgba(27,29,33,.28);
  --r:10px; --r-sm:7px;
  --sans:'IBM Plex Sans KR','Malgun Gothic','Apple SD Gothic Neo',system-ui,sans-serif;
  --serif:'Gowun Batang','Batang','Apple SD Gothic Neo',serif;
  --mono:'IBM Plex Mono','IBM Plex Sans KR',ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#141412; --surface:#1D1E1B; --surface-2:#232420; --surface-3:#2A2B27;
    --border:#33342F; --border-strong:#45463F;
    --ink:#EDEBE5; --ink-2:#A9A79E; --ink-3:#7C7B73;
    --accent:#8FB2E0; --accent-ink:#111820; --accent-soft:#22303F; --accent-line:#3C5570;
    --brass:#D4A64A; --brass-soft:#2E2818;
    --good:#5FB37F; --good-soft:#1C2A21;
    --warn:#D9A93C; --warn-soft:#2C2617;
    --crit:#E8756A; --crit-soft:#2E1C1A;
    --c1:#6B8FE0; --c2:#1F9D86; --c3:#BE8A2C; --c4:#D25E88; --c5:#8E82DE; --c6:#D9743F;
    --grid:#2C2D29;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -18px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
  --bg:#141412; --surface:#1D1E1B; --surface-2:#232420; --surface-3:#2A2B27;
  --border:#33342F; --border-strong:#45463F;
  --ink:#EDEBE5; --ink-2:#A9A79E; --ink-3:#7C7B73;
  --accent:#8FB2E0; --accent-ink:#111820; --accent-soft:#22303F; --accent-line:#3C5570;
  --brass:#D4A64A; --brass-soft:#2E2818;
  --good:#5FB37F; --good-soft:#1C2A21;
  --warn:#D9A93C; --warn-soft:#2C2617;
  --crit:#E8756A; --crit-soft:#2E1C1A;
  --c1:#6B8FE0; --c2:#1F9D86; --c3:#BE8A2C; --c4:#D25E88; --c5:#8E82DE; --c6:#D9743F;
  --grid:#2C2D29;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -18px rgba(0,0,0,.8);
}

/* ── 기본 ───────────────────────────────────────────────── */
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0;font-weight:600;text-wrap:balance}
p{margin:0}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* ── 앱 셸 ──────────────────────────────────────────────── */
.app{display:grid;grid-template-columns:236px 1fr;min-height:100vh}
.sidebar{background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;gap:10px;align-items:center;padding:18px 16px 14px;border-bottom:1px solid var(--border)}
.brand-mark{width:32px;height:32px;border-radius:8px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--serif);font-size:17px;font-weight:700;flex:none}
.brand-name{font-family:var(--serif);font-size:15px;font-weight:700;line-height:1.25}
.brand-sub{font-size:11px;color:var(--ink-3);letter-spacing:.04em}
.nav{padding:10px 10px 24px;display:flex;flex-direction:column;gap:2px;flex:1}
.nav-label{font-size:10.5px;letter-spacing:.12em;color:var(--ink-3);padding:14px 8px 6px;font-weight:600}
.nav-item{display:flex;align-items:center;gap:9px;width:100%;text-align:left;padding:8px 10px;border:0;background:none;border-radius:var(--r-sm);cursor:pointer;color:var(--ink-2);font-size:13.5px}
.nav-item:hover{background:var(--surface-3);color:var(--ink)}
.nav-item[aria-current="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav-item .ico{width:16px;flex:none;opacity:.9;display:grid;place-items:center}
.nav-item .ico svg{display:block}

.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:12px;padding:10px 20px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--border)}
.hamburger{display:none;width:34px;height:34px;border:1px solid var(--border);background:var(--surface);border-radius:var(--r-sm);cursor:pointer;place-items:center}
.topbar-church{font-family:var(--serif);font-size:14px;font-weight:700}
.topbar-meta{font-size:11.5px;color:var(--ink-3)}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.icon-btn{width:34px;height:34px;display:grid;place-items:center;border:1px solid var(--border);background:var(--surface);border-radius:var(--r-sm);cursor:pointer;color:var(--ink-2)}
.icon-btn:hover{border-color:var(--border-strong);color:var(--ink)}
.acct{display:flex;align-items:center;gap:8px;border:1px solid var(--border);background:var(--surface);border-radius:99px;padding:4px 6px 4px 10px}
.acct select{border:0;background:none;font-size:12.5px;font-weight:500;cursor:pointer;max-width:150px}
.acct .avatar{width:26px;height:26px;border-radius:99px;background:var(--brass-soft);color:var(--brass);display:grid;place-items:center;font-size:11.5px;font-weight:600;flex:none}

.wrap{padding:22px 20px 64px;max-width:1240px;width:100%;margin:0 auto;flex:1}
.page-head{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;margin-bottom:18px}
.page-head h1{font-family:var(--serif);font-size:22px;letter-spacing:-.01em}
.page-head .sub{font-size:12.5px;color:var(--ink-3);margin-top:2px}
.page-head .actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}

/* ── 컴포넌트 ───────────────────────────────────────────── */
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border-radius:var(--r-sm);border:1px solid var(--border-strong);background:var(--surface);color:var(--ink);font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--surface-3)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn-primary:hover{filter:brightness(1.08);background:var(--accent)}
.btn-danger{color:var(--crit);border-color:color-mix(in srgb,var(--crit) 45%,var(--border))}
.btn-danger:hover{background:var(--crit-soft)}
.btn-sm{padding:4px 9px;font-size:12px;border-radius:6px}
.btn:disabled{opacity:.45;cursor:not-allowed}

.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow)}
.panel-head{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.panel-head h2{font-size:14px}
.hint{font-size:11.5px;color:var(--ink-3)}
.panel-head .right{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.panel-body{padding:16px}
.panel-body.flush{padding:0}

.grid{display:grid;gap:14px}
.stats{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));margin-bottom:16px}
.stat{background:var(--surface);border:1px solid var(--border);border-left:3px solid transparent;border-radius:var(--r);padding:13px 15px 13px 13px}
.stat .k{font-size:11.5px;color:var(--ink-3);display:flex;align-items:center;gap:6px}
.stat .v{font-family:var(--mono);font-size:26px;font-weight:500;letter-spacing:-.02em;line-height:1.25;margin-top:4px}
.stat .v small{font-family:var(--sans);font-size:12px;font-weight:400;color:var(--ink-3);margin-left:3px}
.stat .m{font-size:11.5px;color:var(--ink-2);margin-top:2px}
.stat.brass{border-left-color:var(--brass)}
.stat.good{border-left-color:var(--good)}
.stat.accentline{border-left-color:var(--accent)}

/* ── 목표 진행 막대 ─────────────────────────────────────── */
.goal-row{display:flex;justify-content:space-between;gap:8px;font-size:11.5px;color:var(--ink-2);margin-bottom:5px}
.goal-bar{height:9px;background:var(--surface-3);border-radius:99px;overflow:hidden}
.goal-bar>i{display:block;height:100%;border-radius:99px;background:var(--brass);transition:width .25s ease}
.goal-bar.accent>i{background:var(--accent)}
.goal-bar.good>i{background:var(--good)}
.fund-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow);padding:15px 16px;display:flex;flex-direction:column;gap:10px}
.fund-card .fh{display:flex;align-items:center;gap:8px}
.fund-card .fh .ico{width:30px;height:30px;border-radius:8px;background:var(--brass-soft);color:var(--brass);display:grid;place-items:center;flex:none}
.fund-card .fh .n{font-family:var(--serif);font-weight:700;font-size:14.5px}
.fund-card .fh .code{font-size:10.5px;color:var(--ink-3);font-family:var(--mono)}
.fund-card .bal{font-family:var(--mono);font-size:25px;font-weight:500;letter-spacing:-.02em}
.fund-card .bal small{font-family:var(--sans);font-size:12px;font-weight:400;color:var(--ink-3);margin-left:3px}

.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:99px;font-size:11.5px;font-weight:500;border:1px solid transparent;white-space:nowrap}
.pill::before{content:"";width:5px;height:5px;border-radius:99px;background:currentColor;flex:none}
.pill.n{background:var(--surface-3);color:var(--ink-2);border-color:var(--border)}
.pill.g{background:var(--good-soft);color:var(--good);border-color:color-mix(in srgb,var(--good) 30%,transparent)}
.pill.w{background:var(--warn-soft);color:var(--warn);border-color:color-mix(in srgb,var(--warn) 30%,transparent)}
.pill.c{background:var(--crit-soft);color:var(--crit);border-color:color-mix(in srgb,var(--crit) 30%,transparent)}
.pill.a{background:var(--accent-soft);color:var(--accent);border-color:var(--accent-line)}
.pill.b{background:var(--brass-soft);color:var(--brass);border-color:color-mix(in srgb,var(--brass) 30%,transparent)}
.pill.plain::before{display:none}

.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-weight:600;font-size:11.5px;letter-spacing:.03em;color:var(--ink-3);padding:9px 14px;border-bottom:1px solid var(--border);background:var(--surface-2);white-space:nowrap;position:sticky;top:0;z-index:1}
td{padding:9px 14px;border-bottom:1px solid var(--border);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--surface-2)}
td.r,th.r{text-align:right}
td.num,th.num{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right}
.rowbtn{background:none;border:0;padding:0;color:var(--accent);font-weight:600;cursor:pointer;font-size:13px;text-align:left}
.rowbtn:hover{text-decoration:underline}

.field{display:flex;flex-direction:column;gap:5px}
.field>label{font-size:11.5px;color:var(--ink-2);font-weight:500}
.field .req{color:var(--crit);margin-left:2px}
input[type=text],input[type=date],input[type=number],input[type=search],input[type=email],input[type=password],select,textarea{
  width:100%;padding:7px 10px;border:1px solid var(--border-strong);border-radius:var(--r-sm);background:var(--surface);font-size:13px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
textarea{resize:vertical;min-height:64px}
.err-msg{font-size:11.5px;color:var(--crit)}
input.bad,select.bad{border-color:var(--crit)}
.formgrid{display:grid;gap:13px;grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.formgrid .full{grid-column:1/-1}
.checkline{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--ink-2)}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filters input,.filters select{width:auto;min-width:120px}

.tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);overflow-x:auto}
.tab{padding:9px 13px;border:0;background:none;cursor:pointer;font-size:13px;color:var(--ink-2);border-bottom:2px solid transparent;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}

.empty{padding:44px 20px;text-align:center;color:var(--ink-3);font-size:13px}
.empty strong{display:block;color:var(--ink-2);font-size:14px;margin-bottom:4px;font-weight:600}

.modal{position:fixed;inset:0;z-index:80;display:grid;place-items:center;padding:16px;background:color-mix(in srgb,#0B0C0A 55%,transparent);backdrop-filter:blur(2px)}
.modal-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:0 24px 64px -24px rgba(0,0,0,.5);width:min(760px,100%);max-height:calc(100vh - 32px);display:flex;flex-direction:column;overflow:hidden}
.modal-card.wide{width:min(980px,100%)}
.modal-card.narrow{width:min(460px,100%)}
.modal-head{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--border)}
.modal-head h2{font-size:15px;font-family:var(--serif);font-weight:700}
.modal-head .sub{font-size:11.5px;color:var(--ink-3)}
.modal-body{padding:18px;overflow:auto}
.modal-foot{display:flex;gap:8px;justify-content:flex-end;padding:12px 18px;border-top:1px solid var(--border);background:var(--surface-2);flex-wrap:wrap}
.modal-foot .left{margin-right:auto}

.toast-host{position:fixed;left:50%;transform:translateX(-50%);bottom:22px;z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:var(--ink);color:var(--bg);padding:9px 15px;border-radius:99px;font-size:12.5px;box-shadow:0 8px 24px -10px rgba(0,0,0,.5);animation:pop .2s ease}
.toast.bad{background:var(--crit);color:#fff}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.notice{display:flex;gap:9px;padding:10px 13px;border-radius:var(--r-sm);font-size:12.5px;border:1px solid var(--border);background:var(--surface-2);color:var(--ink-2);align-items:flex-start}
.notice.w{background:var(--warn-soft);border-color:color-mix(in srgb,var(--warn) 30%,transparent);color:var(--warn)}
.notice.c{background:var(--crit-soft);border-color:color-mix(in srgb,var(--crit) 30%,transparent);color:var(--crit)}
.notice.a{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent)}
.notice b{font-weight:600}

.kv{display:grid;grid-template-columns:96px 1fr;gap:7px 12px;font-size:13px}
.kv dt{color:var(--ink-3);font-size:12px}
.kv dd{margin:0}
.masked{letter-spacing:.06em;color:var(--ink-3)}

.seg{display:inline-flex;border:1px solid var(--border-strong);border-radius:var(--r-sm);overflow-x:auto;overflow-y:hidden;max-width:100%;scrollbar-width:thin}
.seg button{border:0;background:var(--surface);padding:5px 10px;font-size:12px;cursor:pointer;color:var(--ink-2);border-right:1px solid var(--border);white-space:nowrap;flex:none}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}

.att-grid{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.att-row{display:flex;align-items:center;gap:8px;border:1px solid var(--border);border-radius:var(--r-sm);padding:7px 9px;background:var(--surface-2)}
.att-row .nm{font-size:13px;font-weight:500;min-width:0;flex:1}
.att-row .nm span{display:block;font-size:11px;color:var(--ink-3);font-weight:400}
.att-pick{display:flex;gap:3px;flex:none}
.att-pick button{width:40px;height:28px;border-radius:6px;border:1px solid var(--border-strong);background:var(--surface);font-size:11px;cursor:pointer;color:var(--ink-2);padding:0}
.att-pick button[aria-pressed="true"]{font-weight:700}
.att-pick button.s1[aria-pressed="true"]{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.att-pick button.s2[aria-pressed="true"]{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.att-pick button.s3[aria-pressed="true"]{background:var(--crit-soft);border-color:var(--crit);color:var(--crit)}
.att-pick button.s4[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}

/* ── 차트 ───────────────────────────────────────────────── */
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .gridline{stroke:var(--grid);stroke-width:1}
.chart .axis-t{fill:var(--ink-3);font-size:10.5px;font-family:var(--sans)}
.chart .val-t{fill:var(--ink-2);font-size:10.5px;font-family:var(--mono);font-variant-numeric:tabular-nums}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:11.5px;color:var(--ink-2);margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:9px;height:9px;border-radius:2px;display:block}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font-size:11.5px;padding:6px 9px;border-radius:6px;white-space:nowrap;transform:translate(-50%,-115%);opacity:0;transition:opacity .1s;z-index:5}
.tip .tv{font-family:var(--mono);font-weight:500}
.hit{fill:transparent;cursor:pointer}

/* ── 잠금 화면 ──────────────────────────────────────────── */
.lockwrap{position:fixed;inset:0;z-index:300;display:grid;place-items:center;background:var(--bg);padding:20px}
.lockcard{width:min(360px,100%);background:var(--surface);border:1px solid var(--border);border-radius:14px;
  padding:28px 24px 24px;box-shadow:var(--shadow);text-align:center}
.lockcard .brand-mark{width:40px;height:40px;font-size:20px}

/* ── 증명서 ─────────────────────────────────────────────── */
.cert{background:#fff;color:#16181c;border:1px solid var(--border);border-radius:var(--r-sm);padding:38px 40px;font-family:var(--serif);max-width:640px;margin:0 auto}
.cert .cno{font-family:var(--mono);font-size:11px;color:#666;text-align:right}
.cert h3{text-align:center;font-size:26px;letter-spacing:.32em;font-weight:700;margin:18px 0 26px;text-indent:.32em}
.cert table{width:100%;font-size:13.5px;margin-bottom:22px}
.cert table th{background:#f6f5f2;color:#43464c;width:96px;text-align:center;border:1px solid #ddd;padding:8px;position:static;font-family:var(--sans);font-size:12px}
.cert table td{border:1px solid #ddd;padding:8px 12px}
.cert .body{font-size:14px;line-height:2.05;text-align:center;margin:26px 0 34px}
.cert .date{text-align:center;font-size:14px;margin-bottom:22px}
.cert .sign{text-align:center;font-size:16.5px;font-weight:700;position:relative}
.cert .sign .stamp{display:inline-grid;place-items:center;width:52px;height:52px;border:2px solid #b3372f;color:#b3372f;border-radius:6px;font-size:11px;line-height:1.15;margin-left:12px;vertical-align:middle;font-weight:700;transform:rotate(-6deg);opacity:.85}
.cert .foot{margin-top:26px;padding-top:12px;border-top:1px solid #e2e0da;font-size:10.5px;color:#777;text-align:center;font-family:var(--sans);line-height:1.7}

@media print{
  .sidebar,.topbar,.modal-foot,.modal-head,.no-print{display:none!important}
  .modal{position:static;padding:0;background:none;backdrop-filter:none}
  .modal-card{border:0;box-shadow:none;max-height:none;width:100%}
  .modal-body{padding:0;overflow:visible}
  body{background:#fff}
  .cert{border:0;max-width:none}

<script>
/* ══ 상태 · 저장 ════════════════════════════════════════════ */
const KEY = "ccms.v1";
let DB, storageOK = true;
function load() {
  try { const raw = localStorage.getItem(KEY); if (raw) { const p = JSON.parse(raw); if (p && p.ver === 1) return p; } }
  catch (e) { storageOK = false; }
  return seed();
}
function save() {
  try {
    if (typeof LOCK !== "undefined" && LOCK.on) { persistLocal(); return; }
    localStorage.setItem(KEY, JSON.stringify(DB));
  }
  catch (e) { if (storageOK) { storageOK = false; toast("브라우저에 저장하지 못했습니다. 변경 내용은 이 화면에서만 유지됩니다.", true); } }
}
function resetAll() { try { localStorage.removeItem(KEY); } catch (e) { } DB = seed(); save(); route("dashboard"); toast("예시 데이터로 초기화했습니다"); }

/* ══ 권한 ═══════════════════════════════════════════════════ */
const me = () => DB.users.find(u => u.id === DB.session.userId) || DB.users[0];
const myRole = () => DB.roles.find(r => r.id === me().role) || DB.roles[0];
const can = p => myRole().perms.includes(p);
const canAny = (...ps) => ps.some(can);
function inScope(m) { const s = me().scope; return !s || (m.orgs || []).includes(s); }
function scopedMembers() { return DB.members.filter(m => !m.deleted && inScope(m)); }
const mask = (v, keep = 0) => !v ? "-" : keep ? v.slice(0, keep) + "*".repeat(Math.max(0, v.length - keep)) : "***";
const phoneOf = m => !m.phone ? "-" : can("member.pii") ? m.phone : m.phone.replace(/(\d{3})-(\d{4})-(\d{4})/, "$1-****-$3");
const addrOf = m => !m.addr ? "-" : can("member.pii") ? m.addr : m.addr.split(" ").slice(0, 3).join(" ") + " ***";
const birthOf = m => !m.birth ? "-" : can("member.pii") ? m.birth : m.birth.slice(0, 4) + "-**-**";
function audit(act, target, detail) {
  DB.audit.unshift({ id: uid("g"), at: TODAY + " " + new Date().toTimeString().slice(0, 5), user: me().id, act, target, detail });
  if (DB.audit.length > 400) DB.audit.length = 400;
}

/* ══ 조회 헬퍼 ══════════════════════════════════════════════ */
const M = id => DB.members.find(m => m.id === id);
const ORG = id => DB.orgs.find(o => o.id === id);
const EV = id => DB.events.find(e => e.id === id);
const U = id => DB.users.find(u => u.id === id);
const uname = id => (U(id) || {}).name || "-";
function userLinked(uid) {
  return DB.tx.some(t => t.by === uid || t.approvedBy === uid) ||
    DB.donations.some(d => d.createdBy === uid) ||
    (DB.certs || []).some(c => c.issuedBy === uid) ||
    DB.sessions.some(s => s.closedBy === uid);
}
const orgNames = m => (m.orgs || []).map(o => (ORG(o) || {}).n).filter(Boolean).join(", ") || "미배정";
const sessionsOf = eid => DB.sessions.filter(s => s.eventId === eid).sort((a, b) => a.date < b.date ? 1 : -1);
const attOf = sid => DB.attend.filter(a => a.sessionId === sid);
function attRate(sid) {
  const rows = attOf(sid); if (!rows.length) return null;
  const ok = rows.filter(r => r.status === "출석").length;
  return { ok, total: rows.length, pct: Math.round(ok / rows.length * 100) };
}
function memberAtt(mid, from, to) {
  const ss = DB.sessions.filter(s => s.eventId === "w1" && s.date >= from && s.date <= to);
  const ids = new Set(ss.map(s => s.id));
  const rows = DB.attend.filter(a => a.memberId === mid && ids.has(a.sessionId));
  const ok = rows.filter(r => r.status === "출석").length;
  return { total: ss.length, ok, pct: ss.length ? Math.round(ok / ss.length * 100) : 0 };
}
function donSum(mid, from, to) {
  return DB.donations.filter(d => d.memberId === mid && d.date >= from && d.date <= to).reduce((s, d) => s + d.amount, 0);
}
function snapOf(state, m, typeId, period) {
  const ch = state.church;
  return {
    name: m.name, birth: m.birth, addr: m.addr, joined: m.joined, status: m.status, duty: m.duty,
    baptized: m.baptized, orgs: (m.orgs || []).map(o => (state.orgs.find(x => x.id === o) || {}).n).filter(Boolean).join(", "),
    church: ch.name, churchAddr: ch.addr, head: ch.head, headTitle: ch.headTitle, tel: ch.tel,
    bizNo: ch.bizNo || "", donorType: ch.donorType || "종교단체", donorCode: ch.donorCode || "41",
    period, note: ch.certNote, formVer: "v1.0"

}

/* ══ UI 헬퍼 ════════════════════════════════════════════════ */
function toast(msg, bad) {
  const el = document.createElement("div");
  el.className = "toast" + (bad ? " bad" : ""); el.textContent = msg;
  $("#toastHost").appendChild(el);
  setTimeout(() => { el.style.opacity = "0"; setTimeout(() => el.remove(), 250); }, bad ? 4200 : 2200);
}
let modalStack = [];
function openModal(html, opts = {}) {
  const host = $("#modalHost");
  const wrap = document.createElement("div");
  wrap.className = "modal"; wrap.setAttribute("role", "dialog"); wrap.setAttribute("aria-modal", "true");
  wrap.innerHTML = `<div class="modal-card ${opts.size || ""}">${html}</div>`;
  wrap.addEventListener("mousedown", e => { if (e.target === wrap && !opts.sticky) closeModal(); });
  host.appendChild(wrap); modalStack.push(wrap);
  const f = wrap.querySelector("input,select,textarea,button");
  if (f && !opts.noFocus) setTimeout(() => f.focus(), 30);
  return wrap;
}
function closeModal() { const w = modalStack.pop(); if (w) w.remove(); }
document.addEventListener("keydown", e => { if (e.key === "Escape" && modalStack.length) closeModal(); });

function confirmBox(title, msg, onYes, yesLabel = "확인") {
  const w = openModal(`
    <div class="modal-head"><h2>${esc(title)}</h2></div>
    <div class="modal-body"><p style="font-size:13.5px;color:var(--ink-2)">${msg}</p></div>
    <div class="modal-foot"><button class="btn" data-x="no">취소</button><button class="btn btn-primary" data-x="yes">${esc(yesLabel)}</button></div>`, { size: "narrow" });
  w.querySelector('[data-x="no"]').onclick = closeModal;
  w.querySelector('[data-x="yes"]').onclick = () => { onYes(w); closeModal(); };
}

/* ══ 차트 ═══════════════════════════════════════════════════ */
let tipSeq = 0;
function chartShell(inner, legend) {
  const id = "tip" + (++tipSeq);
  return `<div class="chart" data-tip-id="${id}">${inner}<div class="tip" id="${id}"></div></div>${legend || ""}`;
}
function niceMax(v) { if (v <= 0) return 10; const p = Math.pow(10, Math.floor(Math.log10(v))); return Math.ceil(v / (p / 2)) * (p / 2); }
function shortWon(n) { return n >= 100000000 ? (n / 100000000).toFixed(1).replace(/\.0$/, "") + "억" : n >= 10000 ? Math.round(n / 10000).toLocaleString("ko-KR") + "만" : won(n); }

/* 선형 추이 — 단일 계열, 범례 없음(제목이 계열명) */
function chartLine(labels, values, opts = {}) {
  const W = 640, H = opts.h || 190, L = 46, R = 12, T = 12, B = 24;
  const max = niceMax(Math.max(...values, 1)), min = 0;
  const x = i => L + i * (W - L - R) / Math.max(1, labels.length - 1);
  const y = v => H - B - (v - min) / (max - min) * (H - T - B);
  const fmt = opts.fmt || (v => v + (opts.unit || ""));
  let g = "", ax = "";
  for (let i = 0; i <= 4; i++) { const v = max * i / 4, yy = y(v); g += `<line class="gridline" x1="${L}" x2="${W - R}" y1="${yy.toFixed(1)}" y2="${yy.toFixed(1)}"/>`; ax += `<text class="val-t" x="${L - 7}" y="${(yy + 3.5).toFixed(1)}" text-anchor="end">${esc(fmt(Math.round(v)))}</text>`; }

function chartGrouped(labels, s1, s2, opts = {}) {

  const step = Math.ceil(labels.length / 7);
  labels.forEach((l, i) => { if (i % step === 0 || i === labels.length - 1) ax += `<text class="axis-t" x="${x(i).toFixed(1)}" y="${H - 6}" text-anchor="middle">${esc(l)}</text>`; });
  let lines = "", hits = "";

/* 도넛 — 구성비, 범례에 비율 표시 */
function chartDonut(items, opts = {}) {
  const size = 176, r = 68, ir = 42, cx = size / 2, cy = size / 2;
  const total = items.reduce((a, b) => a + Math.max(0, b.value), 0) || 1;
  const fmt = opts.fmt || (v => won(v) + "원");
  const toXY = (a, rad) => [cx + rad * Math.cos(a * Math.PI / 180), cy + rad * Math.sin(a * Math.PI / 180)];
  let angle = -90, slices = "", hits = "";
  items.forEach((it, i) => {
    const v = Math.max(0, it.value), frac = v / total, sweep = frac * 360 || 0;
    const a0 = angle, a1 = angle + sweep, large = sweep > 180 ? 1 : 0;
    const [x0, y0] = toXY(a0, r), [x1, y1] = toXY(a1, r), [ix1, iy1] = toXY(a1, ir), [ix0, iy0] = toXY(a0, ir);
    const d = `M ${x0.toFixed(1)} ${y0.toFixed(1)} A ${r} ${r} 0 ${large} 1 ${x1.toFixed(1)} ${y1.toFixed(1)} L ${ix1.toFixed(1)} ${iy1.toFixed(1)} A ${ir} ${ir} 0 ${large} 0 ${ix0.toFixed(1)} ${iy0.toFixed(1)} Z`;
    const color = it.color || cvar(i);
    if (sweep > 0.5) {
      slices += `<path d="${d}" fill="${color}"/>`;
      const [mx, my] = toXY((a0 + a1) / 2, (r + ir) / 2);
      hits += `<path class="hit" d="${d}" data-tip="${esc(it.label)} · ${esc(fmt(v))} (${Math.round(frac * 100)}%)" data-tx="${mx.toFixed(1)}" data-ty="${my.toFixed(1)}"></path>`;
    }
    angle = a1;
  });
  const legend = `<div class="legend">${items.map((it, i) => `<span><i style="background:${it.color || cvar(i)}"></i>${esc(it.label)} <span class="num" style="color:var(--ink-3)">${Math.round(Math.max(0, it.value) / total * 100)}%</span></span>`).join("")}</div>`;
  return chartShell(`<div style="display:flex;justify-content:center"><svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" role="img" aria-label="${esc(opts.aria || "구성비")}">${slices}${hits}</svg></div>`, legend);
}

  const monthGift = DB.donations.filter(d => d.date.startsWith(ymNow)).reduce((s, d) => s + d.amount, 0);
  const trend = suns.slice(0, 10).reverse();
  const labels = trend.map(s => s.date.slice(5).replace("-", "/"));
  const vals = trend.map(s => (attRate(s.id) || { pct: 0 }).pct);

  const acts = [
    can("member.create") ? `<button class="btn" data-act="new-member">교인 등록</button>` : "",
    can("attend.input") ? `<button class="btn" data-act="go-att">출석 입력</button>` : "",
    can("donation.input") ? `<button class="btn" data-act="go-don">헌금 입력</button>` : "",
    can("cert.issue") ? `<button class="btn btn-primary" data-act="go-cert">증명서 발급</button>` : ""
  ].join("");

  const todo = [];
  if (openSessions.length) todo.push({ t: `출석 미입력 ${openSessions.length}건`, d: openSessions.map(s => `${EV(s.eventId).n} ${s.date}`).join(" · "), go: "attendance", perm: "attend.view", lv: "w" });
  if (longN) todo.push({ t: `장기결석 교인 ${longN}명`, d: `최근 ${DB.church.longAbsentWeeks}주 기준 · 심방 대상 확인`, go: "members", perm: "member.view", lv: "w" });
  const eduPend = (DB.courses || []).filter(c => c.status !== "예정" && c.to < TODAY)
    .flatMap(c => enrollsOf(c.id).filter(e => e.status === "수강중"));
  if (eduPend.length && can("edu.view")) todo.push({ t: `교육 수료 처리 대기 ${eduPend.length}명`, d: "종료일이 지난 과정에 수강중 상태로 남아 있습니다", go: "edu", perm: "edu.view", lv: "w" });
  if (unassigned) todo.push({ t: `구역 미배정 ${unassigned}명`, d: "구역·부서에서 일괄 배정할 수 있습니다", go: "orgs", perm: "org.view", lv: "n" });
  if (pend.length && can("finance.view")) todo.push({ t: `승인 대기 전표 ${pend.length}건`, d: pend.map(t => `${t.desc} ${won(t.amount)}원`).join(" · "), go: "finance", perm: "finance.view", lv: "c" });
  if (can("finance.view")) {
    const bf = FUND("fund-build");
    if (bf && bf.goal) { const pct = Math.round(fundBalance(bf, TODAY) / bf.goal * 100); todo.push({ t: `${bf.name} 목표 달성률 ${pct}%`, d: `현재 잔액 ${won(fundBalance(bf, TODAY))}원 / 목표 ${won(bf.goal)}원`, go: "finance", perm: "finance.view", lv: pct >= 100 ? "g" : "n" }); }
  }
  if (!todo.length) todo.push({ t: "확인이 필요한 항목이 없습니다", d: "출석·재정·배정이 모두 처리된 상태입니다", go: null, lv: "g" });

  const recent = [...ms].sort((a, b) => a.joined < b.joined ? 1 : -1).slice(0, 6);

  return head("대시보드", `${esc(DB.church.name)} · ${esc(me().name)} ${esc(me().title)}님 · ${esc(myRole().n)} 권한${me().scope ? ` · 데이터 범위 ${esc((ORG(me().scope) || {}).n)}` : ""}`, acts) + `
  <div class="stats">
    ${statCard("전체 교인", won(ms.length), `활동 ${activeN}명 · 새가족 ${newN}명`, "명")}
    ${statCard("지난 주일 출석", r ? r.ok : "-", r ? `${lastS.date} · 출석률 ${r.pct}%` : "기록 없음", "명")}
    ${statCard("세대 수", won(DB.families.length), `평균 ${(ms.length / DB.families.length).toFixed(1)}명/세대`, "세대")}
    ${can("donation.view") || can("stat.finance")
      ? statCard("8월 헌금", shortWon(monthGift), `${DB.donations.filter(d => d.date.startsWith(ymNow)).length}건 기록`, "원")
      : statCard("헌금 현황", "비공개", "재정 권한이 있는 계정만 조회합니다")}
    ${can("finance.view")
      ? statCard("회계기간", DB.closedPeriods.includes("2026-07") ? "7월 마감" : "미마감", `승인 대기 ${pend.length}건`)
      : statCard("증명서 발급", won(DB.certs.filter(c => c.status !== "취소").length), "누적 발급 건수", "건")}
  </div>

  <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(320px,1fr))">
    <div class="panel">
      <div class="panel-head"><h2>주일 오전예배 출석률</h2><span class="hint">최근 10주</span>
        <div class="right"><span class="pill n plain">분모: 활동·새가족 ${activeN}명</span></div></div>
      <div class="panel-body">${chartLine(labels, vals, { unit: "%", fmt: v => v + "%", aria: "최근 10주 주일 오전예배 출석률 추이" })}</div>
    </div>
    <div class="panel">
      <div class="panel-head"><h2>확인이 필요한 일</h2><span class="hint">${TODAY} 기준</span></div>
      <div class="panel-body" style="display:flex;flex-direction:column;gap:9px">
        ${todo.map(t => `<div class="notice ${t.lv === "g" ? "" : t.lv}">
          <div style="flex:1;min-width:0"><b>${esc(t.t)}</b><div style="color:var(--ink-3);font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(t.d)}</div></div>
          ${t.go && allowed(t.perm) ? `<button class="btn btn-sm" data-nav="${t.go}">이동</button>` : ""}
        </div>`).join("")}
      </div>
    </div>
  </div>

  <div class="panel" style="margin-top:14px">
    <div class="panel-head"><h2>최근 등록 교인</h2><div class="right"><button class="btn btn-sm" data-nav="members">교인 목록</button></div></div>
    <div class="panel-body flush"><div class="tablewrap"><table>
      <thead><tr><th>성명</th><th>성별·나이</th><th>연락처</th><th>소속</th><th>직분</th><th>상태</th><th>등록일</th></tr></thead>
      <tbody>${recent.map(m => `<tr><td><div style="display:flex;align-items:center;gap:8px">${avatarHTML(m, 24)}<button class="rowbtn" data-member="${m.id}">${esc(m.name)}</button></div></td>
        <td>${esc(m.sex)} · ${age(m.birth)}세</td><td class="num" style="text-align:left">${esc(phoneOf(m))}</td>
        <td>${esc(orgNames(m))}</td><td>${esc(m.duty)}</td><td>${statusPill(m.status)}</td><td class="num" style="text-align:left">${esc(m.joined)}</td></tr>`).join("")}</tbody>
    </table></div></div>
  </div>`;
};

/* ══ 교인관리 ═══════════════════════════════════════════════ */
VS.members = { q: "", status: "", org: "", duty: "", sort: "name", page: 1, trash: false };
VIEWS.members = () => {
  const s = VS.members;
  const pool = DB.members.filter(m => m.deleted === s.trash && inScope(m));
  let list = pool.filter(m => {
    if (s.status && m.status !== s.status) return false;
    if (s.org && !(m.orgs || []).includes(s.org)) return false;
    if (s.duty && m.duty !== s.duty) return false;
    if (s.q) { const q = s.q.trim(); if (!(m.name.includes(q) || (m.phone || "").includes(q) || m.no.includes(q))) return false; }
    return true;
  });
  list.sort((a, b) => s.sort === "name" ? a.name.localeCompare(b.name, "ko")
    : s.sort === "joined" ? (a.joined < b.joined ? 1 : -1)
      : s.sort === "age" ? (a.birth > b.birth ? 1 : -1) : 0);
  const per = 15, pages = Math.max(1, Math.ceil(list.length / per));
  s.page = Math.min(s.page, pages);
  const rows = list.slice((s.page - 1) * per, s.page * per);

  const acts = [
    s.trash ? "" : can("member.create") ? `<button class="btn btn-primary" data-act="new-member">교인 등록</button>` : "",
    can("member.export") && !s.trash ? `<button class="btn" data-act="export">내보내기</button>` : "",
    can("member.delete") ? `<button class="btn" data-act="toggle-trash">${s.trash ? "목록으로" : `휴지통 (${DB.members.filter(m => m.deleted).length})`}</button>` : ""
  ].join("");

  return head(s.trash ? "휴지통" : "교인관리",
    s.trash ? "소프트 삭제된 교인입니다. 복구하면 모든 이력이 함께 살아납니다."
      : `${won(pool.length)}명 중 ${won(list.length)}명 표시${me().scope ? ` · 데이터 범위 ${esc((ORG(me().scope) || {}).n)}` : ""}${can("member.pii") ? "" : " · 연락처·주소 부분 마스킹"}`, acts) + `
  <div class="panel">
    <div class="panel-head">
      <div class="filters">
        <input type="search" id="fq" placeholder="이름·연락처·교인번호" value="${esc(s.q)}" style="min-width:180px">
        <select id="fstatus"><option value="">상태 전체</option>${CODE.status.map(x => `<option ${s.status === x ? "selected" : ""}>${x}</option>`).join("")}</select>
        <select id="forg"><option value="">소속 전체</option>${DB.orgs.map(o => `<option value="${o.id}" ${s.org === o.id ? "selected" : ""}>${esc(o.n)}</option>`).join("")}</select>
        <select id="fduty"><option value="">직분 전체</option>${CODE.duty.map(x => `<option ${s.duty === x ? "selected" : ""}>${x}</option>`).join("")}</select>
        <select id="fsort"><option value="name" ${s.sort === "name" ? "selected" : ""}>이름순</option><option value="joined" ${s.sort === "joined" ? "selected" : ""}>최근 등록순</option><option value="age" ${s.sort === "age" ? "selected" : ""}>연령 높은순</option></select>
      </div>
    </div>
    <div class="panel-body flush">
      ${rows.length ? `<div class="tablewrap"><table>
        <thead><tr><th>교인번호</th><th>성명</th><th>성별·나이</th><th>연락처</th><th>소속</th><th>직분</th><th>상태</th><th>등록일</th><th></th></tr></thead>
        <tbody>${rows.map(m => `<tr>
          <td class="num" style="text-align:left;color:var(--ink-3)">${esc(m.no)}</td>
          <td><div style="display:flex;align-items:center;gap:8px">${avatarHTML(m, 24)}<button class="rowbtn" data-member="${m.id}">${esc(m.name)}</button></div></td>
          <td>${esc(m.sex)} · ${age(m.birth)}세</td>
          <td class="num" style="text-align:left">${esc(phoneOf(m))}</td>
          <td>${esc(orgNames(m))}</td><td>${esc(m.duty)}</td><td>${statusPill(m.status)}</td>
          <td class="num" style="text-align:left">${esc(m.joined)}</td>
          <td class="r">${s.trash
      ? `<button class="btn btn-sm" data-restore="${m.id}">복구</button>`
      : `${can("member.edit") ? `<button class="btn btn-sm" data-edit="${m.id}">수정</button>` : ""}${can("member.delete") ? ` <button class="btn btn-sm btn-danger" data-del-member="${m.id}">삭제</button>` : ""}`}</td></tr>`).join("")}</tbody>
      </table></div>` : `<div class="empty"><strong>조건에 맞는 교인이 없습니다</strong>검색어나 필터를 바꿔보세요.</div>`}
    </div>
    ${pages > 1 ? `<div class="panel-head" style="border-bottom:0;border-top:1px solid var(--border)">
      <span class="hint">${s.page} / ${pages} 페이지</span>
      <div class="right"><button class="btn btn-sm" data-page="${s.page - 1}" ${s.page === 1 ? "disabled" : ""}>이전</button>
      <button class="btn btn-sm" data-page="${s.page + 1}" ${s.page === pages ? "disabled" : ""}>다음</button></div></div>` : ""}
  </div>`;
};
AFTER.members = () => {
  const s = VS.members, r = () => route("members");
  const q = $("#fq"); if (q) { q.oninput = e => { s.q = e.target.value; s.page = 1; const p = e.target.selectionStart; r(); const n = $("#fq"); n.focus(); n.setSelectionRange(p, p); }; }
  ["fstatus:status", "forg:org", "fduty:duty", "fsort:sort"].forEach(pair => {
    const [id, k] = pair.split(":"); const el = $("#" + id);
    if (el) el.onchange = e => { s[k] = e.target.value; s.page = 1; r(); };
  });
};

      </dl></div>
      <div class="full"><div class="notice ${m.consent.contact ? "" : "w"}">
        <div><b>동의 상태</b> 개인정보 수집·이용 ${m.consent.pi ? "동의" : "미동의"} · 연락 수신 ${m.consent.contact ? "동의" : "미동의"} · 동의일 ${esc(m.consent.at)}</div></div></div>
      ${m.memo && can("member.pii") ? `<div class="full"><div class="field"><label>목회 메모 (권한 제한)</label><div class="notice">${esc(m.memo)}</div></div></div>` : ""}
      <div class="full" style="font-size:11.5px;color:var(--ink-3)">등록: ${esc(uname(m.createdBy))} · ${esc(m.createdAt)}</div>

      <div style="margin-top:10px;text-align:right;font-size:13px">누적 합계 <b class="num">${won(gifts.reduce((s, d) => s + d.amount, 0))}</b>원</div>`
      : `<div class="empty">헌금 기록이 없습니다.</div>`,
    cert: () => certs.length ? `<div class="tablewrap"><table><thead><tr><th>발급번호</th><th>종류</th><th>발급일</th><th>발급자</th><th>상태</th></tr></thead><tbody>
      ${certs.map(c => `<tr><td class="num" style="text-align:left">${esc(c.no)}</td><td>${esc((CODE.certTypes.find(t => t.id === c.typeId) || {}).n)}</td>
        <td class="num" style="text-align:left">${esc(c.issuedAt)}</td><td>${esc(uname(c.issuedBy))}</td>
        <td>${c.status === "취소" ? `<span class="pill c">취소</span>` : `<span class="pill g">${esc(c.status)}</span>`}</td></tr>`).join("")}
      </tbody></table></div>` : `<div class="empty">발급된 증명서가 없습니다.</div>`
  };
  const show = k => { $$("#mTabs .tab").forEach(b => b.setAttribute("aria-selected", b.dataset.tab === k)); $("#mBody").innerHTML = panes[k](); };
  show("basic");
  w.querySelectorAll("#mTabs .tab").forEach(b => b.onclick = () => {
    if (b.dataset.tab === "don") { audit("헌금 조회", m.name, "개인별 헌금 내역 열람"); save(); }
    show(b.dataset.tab);
  });
  w.querySelector('[data-x="close"]').onclick = closeModal;
  const e1 = w.querySelector('[data-x="edit"]'); if (e1) e1.onclick = () => { closeModal(); memberForm(m.id); };
  const c1 = w.querySelector('[data-x="cert"]'); if (c1) c1.onclick = () => { closeModal(); certForm(m.id); };
  const d1 = w.querySelector('[data-x="del"]'); if (d1) d1.onclick = () => confirmBox("휴지통으로 이동",
    `<b>${esc(m.name)}</b> 교인을 휴지통으로 옮깁니다. 출석·헌금 기록은 보존되며 휴지통에서 복구할 수 있습니다.`,
    () => { m.deleted = true; audit("교인 삭제", m.name, "소프트 삭제(휴지통 이동)"); save(); closeModal(); route("members"); toast("휴지통으로 옮겼습니다"); }, "휴지통으로");
}

function memberForm(id) {
  const isNew = !id;
  const m = isNew ? { id: "", no: "", name: "", sex: "남", birth: "", phone: "", email: "", addr: "", familyId: "", rel: "본인", joined: TODAY, baptized: "", duty: "성도", status: "새가족", memo: "", orgs: [], consent: { pi: false, contact: false, at: TODAY } } : { ...M(id) };
  const w = openModal(`
    <div class="modal-head"><div><h2>${isNew ? "교인 등록" : "교인 정보 수정"}</h2>
      <div class="sub">${isNew ? "필수 항목을 입력하면 중복 후보를 먼저 확인합니다" : esc(m.no) + " · " + esc(m.name)}</div></div></div>
    <div class="modal-body">
      <div id="dupBox"></div>
      <div class="formgrid">
        <div class="field full"><label>사진</label>
          <div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap">
            <div id="f_photoPreview" style="width:72px;height:72px;border-radius:10px;overflow:hidden;background:var(--surface-3);display:grid;place-items:center;flex:none;border:1px solid var(--border)">${m.photo ? `<img src="${esc(m.photo)}" style="width:100%;height:100%;object-fit:cover" alt="">` : `<span style="color:var(--ink-3);font-size:10.5px">사진 없음</span>`}</div>
            <div style="display:flex;flex-direction:column;gap:6px">
              <input type="file" id="f_photoFile" accept="image/*" style="max-width:220px">
              <div style="display:flex;gap:8px" id="f_photoActions">${m.photo ? `<button type="button" class="btn btn-sm btn-danger" id="f_photoDel">사진 삭제</button>` : ""}</div>
              <div style="font-size:11px;color:var(--ink-3)">JPG·PNG · 정사각형으로 자동 축소되어 저장됩니다</div>
            </div>
          </div>
        </div>
        <div class="field"><label for="f_name">성명<span class="req">*</span></label><input id="f_name" type="text" value="${esc(m.name)}"><div class="err-msg" id="e_name"></div></div>
        <div class="field"><label for="f_sex">성별<span class="req">*</span></label><select id="f_sex"><option ${m.sex === "남" ? "selected" : ""}>남</option><option ${m.sex === "여" ? "selected" : ""}>여</option></select></div>
        <div class="field"><label for="f_birth">생년월일<span class="req">*</span></label><input id="f_birth" type="date" value="${esc(m.birth)}"><div class="err-msg" id="e_birth"></div></div>
        <div class="field"><label for="f_phone">연락처</label><input id="f_phone" type="text" placeholder="010-0000-0000" value="${esc(m.phone)}"></div>
        <div class="field"><label for="f_email">이메일</label><input id="f_email" type="text" value="${esc(m.email)}"></div>
        <div class="field"><label for="f_joined">등록일<span class="req">*</span></label><input id="f_joined" type="date" value="${esc(m.joined)}"><div class="err-msg" id="e_joined"></div></div>
        <div class="field full"><label for="f_addr">주소</label><input id="f_addr" type="text" value="${esc(m.addr)}"></div>
        <div class="field"><label for="f_duty">직분</label><select id="f_duty">${CODE.duty.map(d => `<option ${m.duty === d ? "selected" : ""}>${d}</option>`).join("")}</select></div>
        <div class="field"><label for="f_status">교인상태<span class="req">*</span></label><select id="f_status">${CODE.status.map(d => `<option ${m.status === d ? "selected" : ""}>${d}</option>`).join("")}</select></div>
        <div class="field"><label for="f_bap">세례·입교일</label><input id="f_bap" type="date" value="${esc(m.baptized)}"></div>
        <div class="field"><label for="f_fam">세대</label><select id="f_fam"><option value="">세대 없음(신규)</option>
          ${DB.families.map(f => `<option value="${f.id}" ${m.familyId === f.id ? "selected" : ""}>${esc(f.name)} · ${esc(f.addr.split(",")[0])}</option>`).join("")}</select></div>
        <div class="field"><label for="f_rel">세대 내 관계</label><select id="f_rel">${CODE.rel.map(d => `<option ${m.rel === d ? "selected" : ""}>${d}</option>`).join("")}</select></div>
        <div class="field full"><label>소속 구역·부서·교육기관</label>
          <div style="display:flex;flex-direction:column;gap:8px">${CODE.orgType.map(t => {
      const os = DB.orgs.filter(o => o.type === t);
      return os.length ? `<div><div style="font-size:11px;color:var(--ink-3);margin-bottom:3px">${esc(t)}</div>
        <div style="display:flex;flex-wrap:wrap;gap:6px 14px">${os.map(o =>
        `<label class="checkline"><input type="checkbox" class="f_org" value="${o.id}" ${(m.orgs || []).includes(o.id) ? "checked" : ""}>${esc(o.n)}</label>`).join("")}</div></div>` : "";
    }).join("")}</div></div>
        ${can("member.pii") ? `<div class="field full"><label for="f_memo">목회 메모 (권한 있는 사용자만 조회)</label><textarea id="f_memo">${esc(m.memo || "")}</textarea></div>` : ""}
        <div class="field full"><label>동의 기록</label>
          <div style="display:flex;flex-wrap:wrap;gap:6px 18px">
            <label class="checkline"><input type="checkbox" id="f_pi" ${m.consent.pi ? "checked" : ""}>개인정보 수집·이용 동의<span class="req">*</span></label>
            <label class="checkline"><input type="checkbox" id="f_ct" ${m.consent.contact ? "checked" : ""}>문자·연락 수신 동의</label>
          </div><div class="err-msg" id="e_pi"></div></div>
      </div>
    </div>
    <div class="modal-foot"><button class="btn" data-x="close">취소</button><button class="btn btn-primary" data-x="save">저장</button></div>`, { size: "wide" });

  const dupCheck = () => {
    const nm = $("#f_name").value.trim(), ph = $("#f_phone").value.trim(), bd = $("#f_birth").value;
    if (!nm) { $("#dupBox").innerHTML = ""; return; }
    const dups = DB.members.filter(x => x.id !== m.id && !x.deleted && (x.name === nm && (x.birth === bd || (ph && x.phone === ph))));
    $("#dupBox").innerHTML = dups.length ? `<div class="notice w" style="margin-bottom:14px"><div><b>중복 가능성 ${dups.length}건</b>
      ${dups.map(d => `${esc(d.name)} · ${esc(d.birth)} · ${esc(phoneOf(d))} (${esc(d.no)})`).join("<br>")}<br>같은 사람이면 저장 대신 기존 교인을 수정하세요.</div></div>` : "";
  };
  ["f_name", "f_phone", "f_birth"].forEach(k => $("#" + k).addEventListener("change", dupCheck));
  $("#f_name").addEventListener("blur", dupCheck);
  dupCheck();

  let photoData = m.photo || "";
  const renderPhoto = () => {
    $("#f_photoPreview").innerHTML = photoData ? `<img src="${esc(photoData)}" style="width:100%;height:100%;object-fit:cover" alt="">` : `<span style="color:var(--ink-3);font-size:10.5px">사진 없음</span>`;
    $("#f_photoActions").innerHTML = photoData ? `<button type="button" class="btn btn-sm btn-danger" id="f_photoDel">사진 삭제</button>` : "";
    const delBtn = $("#f_photoDel"); if (delBtn) delBtn.onclick = () => { photoData = ""; $("#f_photoFile").value = ""; renderPhoto(); };
  };
  renderPhoto();
  $("#f_photoFile").onchange = e => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    if (!file.type.startsWith("image/")) { toast("이미지 파일만 선택할 수 있습니다", true); e.target.value = ""; return; }
    const reader = new FileReader();
    reader.onload = ev => {
      const img = new Image();
      img.onload = () => {
        const size = 300;
        const canvas = document.createElement("canvas");
        canvas.width = size; canvas.height = size;
        const ctx = canvas.getContext("2d");
        const side = Math.min(img.width, img.height);
        ctx.drawImage(img, (img.width - side) / 2, (img.height - side) / 2, side, side, 0, 0, size, size);
        photoData = canvas.toDataURL("image/jpeg", 0.85);
        renderPhoto();
      };
      img.onerror = () => toast("이미지를 읽을 수 없습니다", true);
      img.src = ev.target.result;
    };
    reader.onerror = () => toast("파일을 읽는 중 오류가 발생했습니다", true);
    reader.readAsDataURL(file);
  };

  w.querySelector('[data-x="close"]').onclick = closeModal;
  w.querySelector('[data-x="save"]').onclick = () => {
    let ok = true;
    const set = (k, msg) => { $("#e_" + k).textContent = msg || ""; $("#f_" + k).classList.toggle("bad", !!msg); if (msg) ok = false; };
    set("name", $("#f_name").value.trim() ? "" : "성명을 입력하세요.");
    set("birth", $("#f_birth").value ? "" : "생년월일을 입력하세요.");
    set("joined", $("#f_joined").value ? "" : "등록일을 입력하세요.");
    $("#e_pi").textContent = $("#f_pi").checked ? "" : "개인정보 수집·이용 동의가 있어야 저장할 수 있습니다.";
    if (!$("#f_pi").checked) ok = false;
    if (!ok) { toast("입력하지 않은 필수 항목이 있습니다", true); return; }
    const o = {
      name: $("#f_name").value.trim(), sex: $("#f_sex").value, birth: $("#f_birth").value,
      phone: $("#f_phone").value.trim(), email: $("#f_email").value.trim(), addr: $("#f_addr").value.trim(),
      joined: $("#f_joined").value, duty: $("#f_duty").value, status: $("#f_status").value,
      baptized: $("#f_bap").value, familyId: $("#f_fam").value, rel: $("#f_rel").value,
      orgs: $$(".f_org").filter(c => c.checked).map(c => c.value),
      memo: $("#f_memo") ? $("#f_memo").value : m.memo, photo: photoData,
      consent: { pi: $("#f_pi").checked, contact: $("#f_ct").checked, at: TODAY }
    };
    if (isNew) {
      const n = DB.members.length + 1;
      const rec = { id: uid("m"), no: "2" + pad(n, 4), deleted: false, photo: "", createdBy: me().id, createdAt: TODAY, ...o };
      if (!rec.familyId) {
        const f = { id: uid("f"), name: rec.name[0] + "○○ 세대", head: rec.id, addr: rec.addr, org: rec.orgs[0] || "" };
        DB.families.push(f); rec.familyId = f.id; rec.rel = "본인";
      }
      DB.members.push(rec);
      audit("교인 등록", rec.name, `${rec.no} 신규 등록`);
      toast(rec.name + " 교인을 등록했습니다");
    } else {
      const t = M(id); const before = { duty: t.duty, status: t.status, orgs: [...(t.orgs || [])] };
      Object.assign(t, o);
      const ch = [];
      if (before.duty !== t.duty) ch.push(`직분 ${before.duty}→${t.duty}`);
      if (before.status !== t.status) ch.push(`상태 ${before.status}→${t.status}`);
      if (before.orgs.join() !== t.orgs.join()) ch.push("소속 변경");
      audit("교인 수정", t.name, ch.length ? ch.join(" · ") : "기본정보 수정");
      toast("수정했습니다");
    }
    save(); closeModal(); route(CUR === "members" ? "members" : CUR);
  };
}
</script>
<script>
/* ══ 가족·세대 ══════════════════════════════════════════════ */
VS.families = { q: "" };
VIEWS.families = () => {
  const q = VS.families.q.trim();
  const rows = DB.families.map(f => {
    const mem = DB.members.filter(m => m.familyId === f.id && !m.deleted && inScope(m));
    return { f, mem, head: mem.find(m => m.id === f.head) || mem[0] };
  }).filter(r => r.mem.length && (!q || r.mem.some(m => m.name.includes(q))));
  const avg = DB.members.filter(m => !m.deleted).length / Math.max(1, DB.families.length);
  return head("가족·세대", `${won(rows.length)}세대 · 평균 ${avg.toFixed(1)}명 · 세대 분리·합가 시 과거 관계는 이력으로 보존됩니다`,
    `<input type="search" id="fq" placeholder="세대원 이름 검색" value="${esc(VS.families.q)}" style="width:200px">`) + `
  <div class="panel"><div class="panel-body flush"><div class="tablewrap"><table>
    <thead><tr><th>세대</th><th>세대주</th><th>구성</th><th class="num">인원</th><th>주소</th><th>구역</th></tr></thead>
    <tbody>${rows.map(r => `<tr>
      <td><button class="rowbtn" data-family="${r.f.id}">${esc(r.f.name)}</button></td>
      <td>${esc(r.head ? r.head.name : "-")}</td>
      <td style="color:var(--ink-2)">${esc(r.mem.map(m => `${m.name}(${m.rel})`).join(", "))}</td>
      <td class="num">${r.mem.length}</td>
      <td style="color:var(--ink-2)">${esc(can("member.pii") ? r.f.addr : r.f.addr.split(" ").slice(0, 3).join(" ") + " ***")}</td>
      <td>${esc((ORG(r.f.org) || {}).n || "-")}</td></tr>`).join("")}</tbody>
  </table></div></div></div>`;
};
AFTER.families = () => { const el = $("#fq"); if (el) el.oninput = e => { VS.families.q = e.target.value; const p = e.target.selectionStart; route("families"); const n = $("#fq"); n.focus(); n.setSelectionRange(p, p); }; };

function familyModal(fid) {
  const f = DB.families.find(x => x.id === fid); if (!f) return;
  const mem = DB.members.filter(m => m.familyId === fid && !m.deleted);
  const w = openModal(`
    <div class="modal-head"><div><h2>${esc(f.name)}</h2><div class="sub">${esc(can("member.pii") ? f.addr : f.addr.split(" ").slice(0, 3).join(" ") + " ***")}</div></div></div>
    <div class="modal-body">
      <div class="stats">${statCard("구성원", mem.length, "", "명")}
        ${statCard("성인", mem.filter(m => age(m.birth) >= 20).length, "", "명")}
        ${statCard("자녀", mem.filter(m => age(m.birth) < 20).length, "", "명")}</div>
      <div class="tablewrap"><table><thead><tr><th>관계</th><th>성명</th><th>성별·나이</th><th>연락처</th><th>직분</th><th>상태</th></tr></thead><tbody>
      ${mem.map(m => `<tr><td>${esc(m.rel)}${m.id === f.head ? " (세대주)" : ""}</td>
        <td><button class="rowbtn" data-member="${m.id}">${esc(m.name)}</button></td>
        <td>${esc(m.sex)} · ${age(m.birth)}세</td><td class="num" style="text-align:left">${esc(phoneOf(m))}</td>
        <td>${esc(m.duty)}</td><td>${statusPill(m.status)}</td></tr>`).join("")}
      </tbody></table></div>
      <div class="notice" style="margin-top:12px"><div>가족 단위 출석·헌금 조회는 <b>구성원 개인별 권한을 다시 검증</b>합니다. 세대 화면에서는 금액을 제공하지 않습니다.</div></div>
    </div>
    <div class="modal-foot"><button class="btn" data-x="close">닫기</button></div>`, { size: "wide" });
  w.querySelector('[data-x="close"]').onclick = closeModal;
}

/* ══ 구역·부서 ══════════════════════════════════════════════ */
VS.orgs = { type: "구역", sel: "o-gu1" };
VIEWS.orgs = () => {
  const s = VS.orgs;
  const list = DB.orgs.filter(o => o.type === s.type);
  if (!list.find(o => o.id === s.sel)) s.sel = list[0] ? list[0].id : "";
  const cur = ORG(s.sel);
  const mem = scopedMembers().filter(m => (m.orgs || []).includes(s.sel));
  const none = scopedMembers().filter(m => !(m.orgs || []).length);
  const cnt = id => scopedMembers().filter(m => (m.orgs || []).includes(id)).length;
  return head("구역·부서·교육기관", "구역·부서·교육기관별 명단과 배정을 관리합니다. 배정 변경은 적용일과 함께 이력으로 남습니다.",
    can("org.edit") ? `<button class="btn" data-act="new-org">조직 추가</button><button class="btn btn-primary" data-act="assign">교인 배정</button>` : "") + `
  <div class="grid" style="grid-template-columns:260px 1fr;align-items:start">
    <div class="panel">
      <div class="panel-head" style="padding:8px"><div class="seg" style="width:100%">
        ${CODE.orgType.map(t => `<button data-otype="${t}" aria-pressed="${s.type === t}" style="flex:1;padding:5px 4px">${t}</button>`).join("")}</div></div>
      <div class="panel-body" style="padding:8px;display:flex;flex-direction:column;gap:2px">
        ${list.map(o => `<button class="nav-item" data-org="${o.id}" aria-current="${s.sel === o.id}">
          <span style="flex:1">${esc(o.n)}</span><span class="num" style="color:var(--ink-3);font-size:12px">${cnt(o.id)}</span></button>`).join("")}
      </div>
    </div>
    <div style="display:flex;flex-direction:column;gap:14px;min-width:0">
      <div class="panel">
        <div class="panel-head"><h2>${esc(cur ? cur.n : "-")} 명단</h2><span class="hint">${mem.length}명</span>
          <div class="right">${can("member.export") ? `<button class="btn btn-sm" data-act="export-org">명단 내보내기</button>` : ""}</div></div>
        <div class="panel-body flush">${mem.length ? `<div class="tablewrap"><table>
          <thead><tr><th>성명</th><th>성별·나이</th><th>직분</th><th>연락처</th><th>상태</th><th>다른 소속</th>${can("org.edit") ? "<th></th>" : ""}</tr></thead>
          <tbody>${mem.map(m => `<tr><td><button class="rowbtn" data-member="${m.id}">${esc(m.name)}</button></td>
            <td>${esc(m.sex)} · ${age(m.birth)}세</td><td>${esc(m.duty)}</td>
            <td class="num" style="text-align:left">${esc(phoneOf(m))}</td><td>${statusPill(m.status)}</td>
            <td style="color:var(--ink-3)">${esc((m.orgs || []).filter(o => o !== s.sel).map(o => (ORG(o) || {}).n).join(", ") || "-")}</td>
            ${can("org.edit") ? `<td class="r"><button class="btn btn-sm" data-unassign="${m.id}">해제</button></td>` : ""}</tr>`).join("")}</tbody>
        </table></div>` : `<div class="empty"><strong>배정된 교인이 없습니다</strong>교인 배정 버튼으로 명단을 구성하세요.</div>`}</div>
      </div>
      <div class="panel">
        <div class="panel-head"><h2>미배정 교인</h2><span class="hint">어느 구역·부서에도 속하지 않은 교인</span>
          <div class="right"><span class="pill ${none.length ? "w" : "g"}">${none.length}명</span></div></div>
        <div class="panel-body flush">${none.length ? `<div class="tablewrap"><table>

function lastSunday() { const d = dparse(TODAY); while (d.getDay() !== 0) d.setDate(d.getDate() - 1); return dfmt(d); }

      <div class="panel-body">${(() => {
        const h = hist.filter(x => attOf(x.id).length).slice(0, 10).reverse();
        return h.length ? chartLine(h.map(x => x.date.slice(5).replace("-", "/")), h.map(x => attRate(x.id).pct),

};
AFTER.attendance = () => {
  const s = VS.attendance;
  const ev = $("#aEvent"); if (ev) ev.onchange = e => { s.eventId = e.target.value; s.draft = null; route("attendance"); };

};
function saveAttendance(reason) {
  const s = VS.attendance;
  let sess = DB.sessions.find(x => x.id === s.sid);
  if (!sess) { sess = { id: s.sid, eventId: s.eventId, date: s.date, closed: false, closedBy: "", note: "" }; DB.sessions.push(sess); }
  DB.attend = DB.attend.filter(a => a.sessionId !== s.sid);
  Object.entries(s.draft).forEach(([mid, st]) => DB.attend.push({ id: uid("a"), sessionId: s.sid, memberId: mid, status: st }));
  const n = Object.keys(s.draft).length;
  audit(sess.closed ? "마감 출석 수정" : "출석 저장", `${EV(s.eventId).n} ${s.date}`,
    `${n}건 저장${reason ? " · 사유: " + reason : ""}`);

<script>

const CRS = id => DB.courses.find(c => c.id === id);

function courseProgress(c) {
  if (c.status === "예정") return 0;
  const f = dparse(c.from), t = dparse(c.to), now = dparse(TODAY);
  if (now >= t) return c.sessions;
  return Math.max(1, Math.round(c.sessions * (now - f) / Math.max(1, t - f)));
}
function coursePill(c) {
  return c.status === "진행중" ? `<span class="pill g">진행중</span>`

}
function enrollPill(s) {

    </div>
    ${used ? `<div class="notice" style="margin-top:12px"><div>이 계정에는 전표 <b>${used}건</b>이 연결되어 있어 코드와 수입·지출 구분은 바꿀 수 없습니다. 계정명·예산·사용 여부만 수정됩니다.</div></div>` : ""}
    </div>
    <div class="modal-foot"><button class="btn" data-x="c">취소</button><button class="btn btn-primary" data-x="s">저장</button></div>`, { size: "wide" });

  w.querySelector('[data-x="s"]').onclick = () => {
    const code2 = isNew ? $("#a_c").value.trim() : a.c;

    let ok = true;
    $("#e_ac").textContent = ""; $("#e_an").textContent = "";
    if (isNew && !/^[0-9]{3,6}$/.test(code2)) { $("#e_ac").textContent = "숫자 3~6자리로 입력하세요."; ok = false; }

    if (!ok) return toast("입력 내용을 확인하세요", true);

  };
}

<script>
/* ══ 헌금관리 ═══════════════════════════════════════════════ */
VS.donations = { tab: "input", from: "2026-01-01", to: TODAY, type: "", q: "", pledgeYear: "2026" };
function donRows() {
  const s = VS.donations;
  return DB.donations.filter(d => d.date >= s.from && d.date <= s.to && (!s.type || d.type === s.type) &&
    (!s.q || (d.memberId && (M(d.memberId) || {}).name && M(d.memberId).name.includes(s.q.trim()))))
    .sort((a, b) => a.date < b.date ? 1 : -1);
}
/* ── 작정(서약)헌금 ──────────────────────────────────────── */
const PLEDGES = () => DB.pledges || [];
function pledgeTargetLabel(p) {
  if (p.target.kind === "fund") return (FUND(p.target.id) || {}).name || "지정헌금";
  if (p.target.kind === "type") return p.target.name;
  return "전체 헌금";
}
function pledgeMatch(d, p) {
  if (d.memberId !== p.memberId || !d.date.startsWith(String(p.year))) return false;
  if (p.target.kind === "fund") { const f = FUND(p.target.id); return f && f.types.includes(d.type); }
  if (p.target.kind === "type") return d.type === p.target.name;
  return true;
}
function pledgeActual(p) { return DB.donations.filter(d => pledgeMatch(d, p)).reduce((s, d) => s + d.amount, 0); }

/* ── 헌금자 분석 ─────────────────────────────────────────── */
function donorFirstDate(mid) {
  const ds = DB.donations.filter(d => d.memberId === mid && d.amount > 0).map(d => d.date).sort();
  return ds[0] || null;
}
function topGivers(from, to, n = 5) {
  const agg = {}, cnt = {};
  DB.donations.filter(d => d.memberId && inRange(d.date, from, to)).forEach(d => { agg[d.memberId] = (agg[d.memberId] || 0) + d.amount; cnt[d.memberId] = (cnt[d.memberId] || 0) + 1; });
  return Object.entries(agg).map(([id, v]) => ({ m: M(id), v, cnt: cnt[id] }))
    .filter(x => x.m && x.v > 0).sort((a, b) => b.v - a.v).slice(0, n);
}
function newGiversIn(from, to) {
  const ids = new Set(DB.donations.filter(d => d.memberId && inRange(d.date, from, to) && d.amount > 0).map(d => d.memberId));
  return [...ids].filter(id => donorFirstDate(id) >= from).map(M).filter(Boolean);
}
function lapsedGivers(weeks = 8) {
  const cutoff = addDays(TODAY, -weeks * 7);
  const everGave = new Set(DB.donations.filter(d => d.memberId && d.date < cutoff && d.amount > 0).map(d => d.memberId));
  const recentGave = new Set(DB.donations.filter(d => d.memberId && d.date >= cutoff && d.amount > 0).map(d => d.memberId));
  return [...everGave].filter(id => !recentGave.has(id)).map(M).filter(m => m && !m.deleted && ["활동", "새가족"].includes(m.status));
}

function certForm(mid, fixType, reissueOf) {
  const m = M(mid); if (!m) return;
  const w = openModal(`
    <div class="modal-head"><div><h2>${reissueOf ? "증명서 재발급" : "증명서 발급"}</h2>
      <div class="sub">${esc(m.name)} · ${esc(m.no)} · ${esc(m.duty)}${reissueOf ? " · 원본 " + esc(reissueOf.no) : ""}</div></div></div>
    <div class="modal-body">
      <div class="formgrid">
        <div class="field"><label for="ct_type">증명서 종류<span class="req">*</span></label>
          <select id="ct_type">${CODE.certTypes.map(t => `<option value="${t.id}" ${(fixType || (reissueOf || {}).typeId) === t.id ? "selected" : ""}>${t.n}</option>`).join("")}</select></div>
        <div class="field"><label for="ct_date">발급일<span class="req">*</span></label><input type="date" id="ct_date" value="${TODAY}"></div>

        <div class="field"><label for="ct_to2">제출처</label><input type="text" id="ct_to2" value="${esc((reissueOf || {}).to || "")}" placeholder="예: ○○초등학교"></div>
        <div class="field full" id="ctCourseWrap" style="display:none"><label for="ct_course">수료 과정<span class="req">*</span></label>
          <select id="ct_course">${completedCourses(m.id).map(x => `<option value="${x.e.id}">${esc(x.c.n)} · ${esc(x.c.from)}~${esc(x.c.to)} · ${x.e.attended}/${x.c.sessions}회 이수</option>`).join("") || `<option value="">수료한 과정이 없습니다</option>`}</select></div>
        ${reissueOf ? `<div class="field full"><label for="ct_reason">재발급 사유<span class="req">*</span></label><input type="text" id="ct_reason" placeholder="예: 분실 재발급"><div class="err-msg" id="e_reason"></div></div>` : ""}
      </div>
      <div id="ctCheck" style="margin-top:14px"></div>
    </div>
    <div class="modal-foot"><button class="btn" data-x="close">취소</button>
      <button class="btn" data-x="preview">미리보기</button>
      <button class="btn btn-primary" data-x="issue">발급</button></div>`, { size: "wide" });

  const collect = () => {
    const typeId = $("#ct_type").value;
    const period = { from: $("#ct_from").value, to: $("#ct_to").value };
    const snap = snapOf(DB, m, typeId, period);
    if (typeId === "attend") { const a = memberAtt(m.id, period.from, period.to); snap.att = a; }
    if (typeId === "edu") {
      const sel = $("#ct_course"), en = sel ? DB.enrolls.find(x => x.id === sel.value) : null;
      const cc = en ? CRS(en.courseId) : null;
      if (cc) snap.edu = { name: cc.n, cat: cc.cat, from: cc.from, to: cc.to, sessions: cc.sessions, attended: en.attended, completedAt: en.completedAt || cc.to };
    }
    if (typeId === "donation" || typeId === "donationTax") {
      snap.gift = donSum(m.id, period.from, period.to);
      snap.giftCount = DB.donations.filter(d => d.memberId === m.id && d.date >= period.from && d.date <= period.to).length;
    }
    return { typeId, period, snap };
  };
  const check = () => {
    const { typeId, snap } = collect();
    const miss = [];
    if (!m.birth) miss.push(["생년월일", "교인 수정 화면"]);
    if (!m.addr && typeId === "member") miss.push(["주소", "교인 수정 화면"]);
    if (typeId === "baptism" && !m.baptized) miss.push(["세례·입교일", "교인 수정 화면 › 세례·입교일"]);
    if (typeId === "duty" && !m.duty) miss.push(["직분", "교인 수정 화면"]);
    if (typeId === "attend" && !snap.att.total) miss.push(["대상 기간 출석 기록", "출석관리"]);
    const cw = $("#ctCourseWrap"); if (cw) cw.style.display = typeId === "edu" ? "" : "none";
    if (typeId === "edu" && !snap.edu) miss.push(["수료한 교육 과정", "교육관리 › 수료 처리"]);
    if (typeId === "donationTax") {
      if (!m.addr) miss.push(["주소", "교인 수정 화면"]);
      if (!snap.gift) miss.push(["과세기간 내 헌금 기록", "헌금관리 › 헌금 입력"]);
      if (!DB.church.bizNo) miss.push(["기부단체 고유번호", "설정 › 교회정보"]);
    }
    if (["이명", "소천"].includes(m.status)) miss.push([`현재 교인상태(${m.status})`, "발급 자격 확인"]);
    $("#ctCheck").innerHTML = miss.length
      ? `<div class="notice c"><div><b>발급 전 보완이 필요합니다</b>${miss.map(x => `<br>· ${esc(x[0])} — ${esc(x[1])}에서 입력하세요`).join("")}</div></div>`
      : `<div class="notice"><div><b>필수 정보 확인 완료</b> 자동 반영: ${esc(((CODE.certTypes.find(t => t.id === typeId) || {}).fields || []).join(" · "))}</div></div>`;
    return miss;
  };
  check();
  ["ct_type", "ct_from", "ct_to", "ct_course"].forEach(id => { const el = $("#" + id); if (el) el.onchange = check; });
  w.querySelector('[data-x="close"]').onclick = closeModal;
  w.querySelector('[data-x="preview"]').onclick = () => {
    const c = collect();
    certPreview({ ...c, no: `${DB.church.certPrefix}-2026-${pad(DB.church.certSeq + 1, 4)}`, issuedAt: $("#ct_date").value, issuedBy: me().id, memberId: m.id, purpose: $("#ct_purpose").value, to: $("#ct_to2").value, status: "미리보기" }, true);
  };
  w.querySelector('[data-x="issue"]').onclick = () => {
    if (check().length) { toast("보완이 필요한 항목이 있어 발급할 수 없습니다", true); return; }
    if (reissueOf && !$("#ct_reason").value.trim()) { $("#e_reason").textContent = "재발급 사유를 입력하세요."; return; }
    const c = collect();
    DB.church.certSeq++;
    const rec = {
      id: uid("c"), no: `${DB.church.certPrefix}-2026-${pad(DB.church.certSeq, 4)}`, typeId: c.typeId, memberId: m.id,
      issuedAt: $("#ct_date").value, issuedBy: me().id, purpose: $("#ct_purpose").value.trim(), to: $("#ct_to2").value.trim(),
      status: "발급", reissueOf: reissueOf ? reissueOf.id : null, reason: reissueOf ? $("#ct_reason").value.trim() : "",
      period: c.period, snap: c.snap
    };
    DB.certs.push(rec);
    audit(reissueOf ? "증명서 재발급" : "증명서 발급", `${rec.no} ${(CODE.certTypes.find(t => t.id === rec.typeId) || {}).n}`,
      `${m.name} · ${rec.to || "제출처 미기재"}${reissueOf ? " · 사유: " + rec.reason : ""}`);
    save(); closeModal(); certPreview(rec); toast(`${rec.no} 발급 완료`);
    if (CUR === "certs") { VS.certs.tab = "ledger"; }
  };
}

function certPreview(c, draft) {

  if (c.typeId === "duty") rows.push(["직 분", s.duty], ["소 속", s.orgs || "-"], ["등 록 일", kdate(s.joined)]);
  if (c.typeId === "baptism") rows.push(["예식 종류", "세례(입교)"], ["예 식 일", kdate(s.baptized)]);

  if (c.typeId === "edu" && s.edu) rows.push(["과 정 명", `${s.edu.name} (${s.edu.cat})`],

  if (c.typeId === "donation") rows.push(["대상 기간", `${kdate(c.period.from)} ~ ${kdate(c.period.to)}`],

  const bodyText = {

    duty: `위 사람은 본 교회의 ${s.duty}(으)로 재직 중임을 증명합니다.`,
    baptism: `위 사람은 본 교회에서 세례(입교)를 받았음을 증명합니다.`,
    attend: `위 사람은 위 기간 동안 본 교회 예배에 위와 같이 출석하였음을 증명합니다.`,
    edu: `위 사람은 본 교회에서 시행한 위 교육 과정을 이수하였음을 증명합니다.`,
    donation: `위 사람은 위 기간 동안 본 교회에 위 금액을 헌금하였음을 확인합니다.`,
    donationTax: `위와 같이 기부금을 납입하였음을 증명합니다.`
  }[c.typeId];
  const w = openModal(`
    <div class="modal-head"><div><h2>${esc(t.n)} ${draft ? "미리보기" : ""}</h2>
      <div class="sub">${esc(c.no)} · ${esc(c.issuedAt)} · 발급자 ${esc(uname(c.issuedBy))}${c.status === "취소" ? " · 취소됨" : ""}</div></div></div>

      <div class="cert">
        <div class="cno">${esc(c.no)}</div>
        <h3>${esc(t.n)}</h3>

}

/* ══ 작정헌금 등록·수정 ═════════════════════════════════════ */
function pledgeForm(id) {
  const p0 = id ? PLEDGES().find(x => x.id === id) : null;
  const isNew = !p0;
  const targetVal = p0 ? (p0.target.kind === "fund" ? "fund:" + p0.target.id : p0.target.kind === "type" ? "type:" + p0.target.name : "total") : "type:십일조";
  const memberList = scopedMembers().filter(m => m.status !== "소천").sort((a, b) => a.name.localeCompare(b.name, "ko"));
  const w = openModal(`
    <div class="modal-head"><div><h2>${isNew ? "작정헌금 등록" : "작정헌금 수정"}</h2><div class="sub">연간 약정 금액과 실제 헌금 실적을 비교합니다</div></div></div>
    <div class="modal-body"><div class="formgrid">
      <div class="field"><label for="pl_m">교인<span class="req">*</span></label>
        <select id="pl_m" ${isNew ? "" : "disabled"}>${memberList.map(m => `<option value="${m.id}" ${(p0 && p0.memberId === m.id) ? "selected" : ""}>${esc(m.name)} (${esc(m.no)})</option>`).join("")}</select></div>
      <div class="field"><label for="pl_y">연도<span class="req">*</span></label><input type="number" id="pl_y" value="${p0 ? p0.year : "2026"}" min="2000" max="2100"></div>
      <div class="field full"><label for="pl_target">약정 대상<span class="req">*</span></label>
        <select id="pl_target">
          <option value="total" ${targetVal === "total" ? "selected" : ""}>전체 헌금</option>
          ${CODE.donation.map(t => `<option value="type:${t}" ${targetVal === "type:" + t ? "selected" : ""}>${esc(t)} (헌금 종류)</option>`).join("")}
          ${FUNDS().map(f => `<option value="fund:${f.id}" ${targetVal === "fund:" + f.id ? "selected" : ""}>${esc(f.name)} (지정헌금 펀드)</option>`).join("")}
        </select></div>
      <div class="field"><label for="pl_amt">연간 약정액(원)<span class="req">*</span></label><input type="number" id="pl_amt" value="${p0 ? p0.amount : ""}" min="0" step="10000" placeholder="0"><div class="err-msg" id="e_plamt"></div></div>
      <div class="field full"><label for="pl_note">메모</label><input type="text" id="pl_note" value="${esc((p0 || {}).note || "")}" placeholder="선택"></div>
    </div></div>
    <div class="modal-foot"><button class="btn" data-x="c">취소</button><button class="btn btn-primary" data-x="s">저장</button></div>`, { size: "wide" });
  w.querySelector('[data-x="c"]').onclick = closeModal;
  w.querySelector('[data-x="s"]').onclick = () => {
    const amt = Math.round(Number($("#pl_amt").value));
    if (!(amt > 0)) { $("#e_plamt").textContent = "0보다 큰 금액을 입력하세요."; return toast("금액을 확인하세요", true); }
    const tv = $("#pl_target").value;
    const target = tv === "total" ? { kind: "total" } : tv.startsWith("fund:") ? { kind: "fund", id: tv.slice(5) } : { kind: "type", name: tv.slice(5) };
    const year = Math.round(Number($("#pl_y").value)) || 2026;
    const note = $("#pl_note").value.trim();
    if (isNew) {
      const mid = $("#pl_m").value, m = M(mid);
      DB.pledges.push({ id: uid("pl"), memberId: mid, year, target, amount: amt, note, createdAt: TODAY, createdBy: me().id });
      audit("작정헌금 등록", `${m.name} ${year}년`, `${pledgeTargetLabel({ target })} · ${won(amt)}원`);
      toast("작정헌금을 등록했습니다");
    } else {
      p0.year = year; p0.target = target; p0.amount = amt; p0.note = note;
      audit("작정헌금 수정", `${(M(p0.memberId) || {}).name} ${year}년`, `${pledgeTargetLabel(p0)} · ${won(amt)}원`);
      toast("수정했습니다");
    }
    save(); closeModal(); VS.donations.tab = "pledge"; VS.donations.pledgeYear = String(year); route("donations");
  };
}

VS.finance = { tab: "tx", from: "2026-01-01", to: TODAY, kind: "", acct: "" };
const ACCTS = () => (DB.accounts && DB.accounts.length) ? DB.accounts : CODE.acct;
const acctLive = () => ACCTS().filter(a => a.active !== false);
const acctName = c => (ACCTS().find(a => a.c === c) || {}).n || c;
const canAcct = () => can("admin.settings") || can("finance.input");
const inRange = (d, from, to) => (!from || d >= from) && (!to || d <= to);
function addDays(dateStr, n) { const d = dparse(dateStr); d.setDate(d.getDate() + n); return dfmt(d); }
function periodBalance(from, to) {
  const inc = DB.tx.filter(t => t.status === "승인" && t.kind === "수입" && inRange(t.date, from, to)).reduce((s, t) => s + t.amount, 0);
  const exp = DB.tx.filter(t => t.status === "승인" && t.kind === "지출" && inRange(t.date, from, to)).reduce((s, t) => s + t.amount, 0);
  return inc - exp;
}
function dataYears() {
  const ys = new Set([...DB.tx.map(t => t.date.slice(0, 4)), ...DB.donations.map(d => d.date.slice(0, 4))]);
  return [...ys].sort();
}
/* ── 지정헌금 · 펀드 회계 ────────────────────────────────── */
const FUNDS = () => DB.funds || [];
const FUND = id => FUNDS().find(f => f.id === id);
function fundIncome(f, from, to) {
  const giving = DB.donations.filter(d => f.types.includes(d.type) && inRange(d.date, from, to)).reduce((s, d) => s + d.amount, 0);
  const manual = DB.tx.filter(t => t.fund === f.id && t.status === "승인" && t.kind === "수입" && inRange(t.date, from, to)).reduce((s, t) => s + t.amount, 0);
  return giving + manual;
}
function fundExpense(f, from, to) {
  return DB.tx.filter(t => t.fund === f.id && t.status === "승인" && t.kind === "지출" && inRange(t.date, from, to)).reduce((s, t) => s + t.amount, 0);
}
function fundBalance(f, asOf) {
  return (f.opening || 0) + fundIncome(f, null, asOf) - fundExpense(f, null, asOf);
}
function fundCard(f) {
  const bal = fundBalance(f, TODAY);
  const pct = f.goal ? Math.max(0, Math.min(100, Math.round(bal / f.goal * 100))) : null;
  return `<div class="fund-card">
    <div class="fh"><span class="ico">${ic("finance")}</span><div><div class="n">${esc(f.name)}</div><div class="code">${esc(f.code)} · ${esc(f.types.join(", "))}</div></div></div>
    <div class="bal">${won(bal)}<small>원 잔액</small></div>
    ${f.goal ? `<div><div class="goal-row"><span>목표 ${shortWon(f.goal)}원</span><span class="num">${pct}%</span></div>
      <div class="goal-bar"><i style="width:${pct}%"></i></div></div>`
      : `<div class="m" style="font-size:11.5px;color:var(--ink-3)">목표액 없음 · 잔액만 추적</div>`}
    <div class="m" style="color:var(--ink-2)">${esc(f.note || "")}</div>
  </div>`;
}
