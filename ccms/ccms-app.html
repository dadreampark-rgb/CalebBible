   자동 저장하고, 하루 1회 날짜별 백업본을 남긴다.
   지원하지 않는 브라우저에서는 수동 반출·복원으로 대체한다.
   ═════════════════════════════════════════════════════════ */
const FS = {
  dir: null, name: "", last: "", busy: false,
  inFrame: window.self !== window.top,
  supported: typeof window.showDirectoryPicker === "function" && window.self === window.top
};
const DATA_FILE = "교회데이터.json";
const BACKUP_DIR = "백업";

/* 폴더 핸들 보관용 초소형 IndexedDB */
function idb(mode, fn) {
  return new Promise((res, rej) => {
    const rq = indexedDB.open("ccms-fs", 1);
    rq.onupgradeneeded = () => rq.result.createObjectStore("h");
    rq.onerror = () => rej(rq.error);
    rq.onsuccess = () => {
      const tx = rq.result.transaction("h", mode), st = tx.objectStore("h");
      const r = fn(st); tx.oncomplete = () => res(r && r.result); tx.onerror = () => rej(tx.error);
    };
  });
}
const putHandle = h => idb("readwrite", st => st.put(h, "dir")).catch(() => { });
const getHandle = () => idb("readonly", st => st.get("dir")).catch(() => null);
const delHandle = () => idb("readwrite", st => st.delete("dir")).catch(() => { });

async function writeJSON(dir, name, text) {
  const fh = await dir.getFileHandle(name, { create: true });
  const w = await fh.createWritable();
  await w.write(new Blob([text], { type: "application/json" }));
  await w.close();
}
function stamp() { return new Date().toTimeString().slice(0, 5); }

async function connectFolder() {
  if (!FS.supported) { toast("이 브라우저는 폴더 저장을 지원하지 않습니다. 수동 반출을 사용하세요.", true); return; }
  try {
    const dir = await window.showDirectoryPicker({ id: "ccms", mode: "readwrite", startIn: "documents" });
    if ((await dir.requestPermission({ mode: "readwrite" })) !== "granted") { toast("폴더 쓰기 권한이 거부되었습니다", true); return; }
    FS.dir = dir; FS.name = dir.name; await putHandle(dir);
    let existing = null;
    try {
      const fh = await dir.getFileHandle(DATA_FILE);
      const txt = await (await fh.getFile()).text();
      const p = JSON.parse(txt);
      if (p && (p.ver === 1 || p.lock === 1)) existing = txt;
    } catch (e) { }
    if (existing) {
      confirmBox("폴더에 저장된 데이터가 있습니다",
        `<b>${esc(FS.name)}</b> 폴더의 <b>${DATA_FILE}</b>을(를) 불러올까요?<br><br>
         불러오면 지금 이 브라우저의 내용은 폴더 파일로 대체됩니다. 취소하면 지금 내용을 폴더에 저장합니다.`,
        () => applyRestore(existing, FS.name + "/" + DATA_FILE),
        "폴더 데이터 불러오기");
    }
    await writeFolder(true);
    audit("폴더 연결", FS.name, "자동 저장 폴더 지정");
    save(); route(CUR);
    toast(`${FS.name} 폴더에 자동 저장합니다`);
  } catch (e) { if (e && e.name !== "AbortError") toast("폴더를 연결하지 못했습니다: " + e.message, true); }
}
async function reconnectFolder(silent) {
  if (!FS.supported) return;
  const h = await getHandle(); if (!h) return;
  try {
    const st = await h.queryPermission({ mode: "readwrite" });
    if (st === "granted") { FS.dir = h; FS.name = h.name; if (!silent) toast(`${h.name} 폴더에 연결했습니다`); return true; }
    if (!silent) {
      if ((await h.requestPermission({ mode: "readwrite" })) === "granted") {
        FS.dir = h; FS.name = h.name; toast(`${h.name} 폴더에 다시 연결했습니다`); return true;
      }
    } else { FS.name = h.name; }
  } catch (e) { }
  return false;
}
async function disconnectFolder() {
  FS.dir = null; FS.name = ""; FS.last = ""; await delHandle();
  audit("폴더 연결 해제", "-", "자동 저장 중지"); save(); route("settings"); toast("폴더 연결을 해제했습니다");
}
async function writeFolder(force) {
  if (!FS.dir || FS.busy) return false;
  FS.busy = true;
  try {
    const txt = await serializeText();
    await writeJSON(FS.dir, DATA_FILE, txt);
    let day = "";
    try { day = localStorage.getItem("ccms.backupDay") || ""; } catch (e) { }
    if (force || day !== TODAY) {
      const bk = await FS.dir.getDirectoryHandle(BACKUP_DIR, { create: true });
      await writeJSON(bk, `교회데이터-${TODAY}.json`, txt);
      try { localStorage.setItem("ccms.backupDay", TODAY); } catch (e) { }
    }
    FS.last = stamp();
    const el = $("#fsLast"); if (el) el.textContent = `마지막 저장 ${FS.last}`;
    return true;
  } catch (e) {
    FS.dir = null;
    toast("폴더에 저장하지 못했습니다. 다시 연결하세요: " + e.message, true);
    return false;
  } finally { FS.busy = false; }
}
let fsTimer = null;
function scheduleFolderSave() {
  if (!FS.dir) return;
  clearTimeout(fsTimer);
  fsTimer = setTimeout(() => writeFolder(false), 1200);
}
/* save()가 호출될 때마다 폴더 저장을 예약 */
const __save = save;
save = function () { __save(); scheduleFolderSave(); };

/* ── 복원 ── */
function applyRestore(txt, src) {
  if (isEnvelope(txt)) { restoreEnvelope(JSON.parse(txt), src); return; }
  let p;
  try { p = JSON.parse(txt); } catch (e) { toast("JSON 형식이 아닙니다", true); return; }
  if (!p || p.ver !== 1 || !Array.isArray(p.members) || !p.church) { toast("이 시스템의 백업 파일이 아닙니다", true); return; }
  DB = p; save(); paintShell(); renderNav(); route("dashboard");
  audit("데이터 복원", src, `교인 ${p.members.length}명 · 헌금 ${(p.donations || []).length}건 복원`);
  save(); toast("백업 데이터를 복원했습니다");
}
function restoreFromFile() {
  const inp = document.createElement("input");
  inp.type = "file"; inp.accept = "application/json,.json";
  inp.onchange = () => {
    const f = inp.files && inp.files[0]; if (!f) return;
    const rd = new FileReader();
    rd.onload = () => applyRestore(String(rd.result), f.name);
    rd.onerror = () => toast("파일을 읽지 못했습니다", true);

}
function restoreTextModal() {

    <div class="modal-head"><div><h2>백업 내용 붙여넣기 복원</h2><div class="sub">반출한 JSON 내용을 그대로 붙여넣으세요</div></div></div>
    <div class="modal-body">

      <textarea id="rsBox" placeholder='{"church":{...},"members":[...],"ver":1}' style="height:220px;font-family:var(--mono);font-size:11px"></textarea>
    </div>

  w.querySelector('[data-x="c"]').onclick = closeModal;
  w.querySelector('[data-x="s"]').onclick = () => { const t = $("#rsBox").value.trim(); if (!t) return toast("내용을 붙여넣으세요", true); closeModal(); applyRestore(t, "붙여넣기"); };

</script>
<script>
/* ══ 잠금 · 데이터 암호화 ═══════════════════════════════════
   비밀번호로 데이터 자체를 암호화한다(AES-256-GCM).
   비밀번호 → PBKDF2(SHA-256, 310,000회)로 키를 만들고 그 키로
   '마스터키'를 감싼다. 마스터키가 실제 데이터를 암호화한다.
   → 사용자마다 비밀번호가 달라도 같은 자료를 열 수 있고,
     비밀번호를 바꿔도 자료 전체를 다시 암호화할 필요가 없다.
   비밀번호는 어디에도 저장되지 않는다. 잊으면 되살릴 수 없다.
   ═════════════════════════════════════════════════════════ */
var LOCK = { on: false, wrap: {}, iters: 310000, master: null, user: "", tries: 0, until: 0 };
var MASTER_RAW = null;
const TE = new TextEncoder(), TD = new TextDecoder();
const CRY = (window.crypto && window.crypto.subtle) ? window.crypto : null;

const b64 = buf => { const u = new Uint8Array(buf); let s = ""; for (let i = 0; i < u.length; i++) s += String.fromCharCode(u[i]); return btoa(s); };
const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

async function pwKey(pw, salt, iters) {
  const base = await CRY.subtle.importKey("raw", TE.encode(pw), "PBKDF2", false, ["deriveKey"]);
  return CRY.subtle.deriveKey({ name: "PBKDF2", salt, iterations: iters, hash: "SHA-256" },
    base, { name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]);
}
async function seal(key, text) {
  const iv = CRY.getRandomValues(new Uint8Array(12));
  const ct = await CRY.subtle.encrypt({ name: "AES-GCM", iv }, key, TE.encode(text));
  return { i: b64(iv), c: b64(ct) };
}
async function open_(key, box) {
  const pt = await CRY.subtle.decrypt({ name: "AES-GCM", iv: unb64(box.i) }, key, unb64(box.c));
  return TD.decode(pt);
}
const masterKey = raw => CRY.subtle.importKey("raw", raw, { name: "AES-GCM" }, false, ["encrypt", "decrypt"]);

/* ── 저장 형식 ── */
function isEnvelope(txt) { try { const o = JSON.parse(txt); return !!(o && o.lock === 1 && o.data && o.wrap); } catch (e) { return false; } }
function readRaw() { try { return localStorage.getItem(KEY); } catch (e) { return null; } }

async function envelope() {
  const body = await seal(LOCK.master, JSON.stringify(DB));
  return {
    lock: 1, iters: LOCK.iters, church: DB.church.name, at: TODAY,
    users: DB.users.map(u => ({ id: u.id, name: u.name, title: u.title, has: !!LOCK.wrap[u.id] })),
    wrap: LOCK.wrap, data: body
  };
}
async function serializeText() { return LOCK.on && LOCK.master ? JSON.stringify(await envelope()) : JSON.stringify(DB); }

let persistBusy = false, persistAgain = false;
async function persistLocal() {
  if (persistBusy) { persistAgain = true; return; }
  persistBusy = true;
  try {
    do {
      persistAgain = false;
      const txt = await serializeText();
      try { localStorage.setItem(KEY, txt); }
      catch (e) { if (storageOK) { storageOK = false; toast("브라우저에 저장하지 못했습니다.", true); } }
    } while (persistAgain);
  } finally { persistBusy = false; }
}

/* ── 설정 · 변경 ── */
async function enableLock(pw) {
  const raw = CRY.getRandomValues(new Uint8Array(32));
  MASTER_RAW = raw;
  LOCK.master = await masterKey(raw);
  LOCK.wrap = {};
  await setUserPassword(me().id, pw);
  LOCK.on = true; LOCK.user = me().id;
  audit("잠금 사용 시작", DB.church.name, `${me().name} 비밀번호 설정 · AES-256-GCM`);
  await persistLocal(); scheduleFolderSave(); armAutoLock();
}
async function setUserPassword(uid, pw) {
  if (!MASTER_RAW) throw new Error("잠금이 열려 있지 않습니다");
  const salt = CRY.getRandomValues(new Uint8Array(16));
  const k = await pwKey(pw, salt, LOCK.iters);
  const box = await seal(k, b64(MASTER_RAW));
  LOCK.wrap[uid] = { s: b64(salt), i: box.i, c: box.c };
}
async function tryUnlock(uid, pw, env) {
  const w = (env ? env.wrap : LOCK.wrap)[uid];
  if (!w) throw new Error("이 계정에는 비밀번호가 설정되어 있지 않습니다");
  const k = await pwKey(pw, unb64(w.s), (env && env.iters) || LOCK.iters);
  const rawB64 = await open_(k, { i: w.i, c: w.c });     /* 비밀번호가 틀리면 여기서 실패 */
  const raw = unb64(rawB64);
  MASTER_RAW = raw;
  return masterKey(raw);
}
async function disableLock() {
  LOCK.on = false; LOCK.wrap = {}; LOCK.master = null; MASTER_RAW = null;
  clearTimeout(autoTimer);
  audit("잠금 끄기", DB.church.name, "이후 자료를 암호화하지 않고 저장합니다");
  await persistLocal(); scheduleFolderSave();
}
function removeUserPassword(uid) {
  delete LOCK.wrap[uid];
  audit("비밀번호 삭제", uname(uid), "이 계정은 더 이상 열 수 없습니다");
  persistLocal().then(() => { scheduleFolderSave(); route("settings"); });
}

/* ── 잠금 화면 ── */
let lockResolve = null;
function lockScreen(env, msg) {
  const users = (env.users || []).filter(u => u.has);
  const host = document.createElement("div");
  host.className = "lockwrap"; host.id = "lockWrap";
  host.innerHTML = `
    <div class="lockcard">
      <div class="brand-mark" style="margin:0 auto 14px">敎</div>
      <div style="font-family:var(--serif);font-size:17px;font-weight:700">${esc(env.church || "교회")} 관리시스템</div>
      <p style="font-size:12.5px;color:var(--ink-3);margin:6px 0 18px">비밀번호를 입력해야 자료가 열립니다</p>
      <div class="field" style="text-align:left;margin-bottom:10px">
        <label for="lkUser">사용자</label>
        <select id="lkUser" ${users.length < 2 ? "disabled" : ""}>${users.map(u => `<option value="${u.id}">${esc(u.name)} · ${esc(u.title)}</option>`).join("")}</select>
      </div>
      <div class="field" style="text-align:left"><label for="lkPw">비밀번호</label>
        <input type="password" id="lkPw" autocomplete="current-password"></div>
      <div class="err-msg" id="lkErr" style="min-height:18px;margin-top:6px">${msg ? esc(msg) : ""}</div>
      <button class="btn btn-primary" id="lkGo" style="width:100%;justify-content:center;margin-top:6px">열기</button>
      <p style="font-size:11px;color:var(--ink-3);margin-top:16px;line-height:1.7">비밀번호는 어디에도 저장되지 않습니다.<br>잊으면 자료를 되살릴 수 없습니다.</p>
    </div>`;
  document.body.appendChild(host);
  const pw = host.querySelector("#lkPw"), go = host.querySelector("#lkGo"), err = host.querySelector("#lkErr");
  setTimeout(() => pw.focus(), 50);
  const attempt = async () => {
    const now = Date.now();
    if (now < LOCK.until) { err.textContent = `잠시 후 다시 시도하세요 (${Math.ceil((LOCK.until - now) / 1000)}초)`; return; }
    const uid = host.querySelector("#lkUser").value, v = pw.value;
    if (!v) { err.textContent = "비밀번호를 입력하세요."; return; }
    go.disabled = true; err.textContent = "확인 중…";
    try {
      const key = await tryUnlock(uid, v, env);
      LOCK.master = key; LOCK.on = true; LOCK.user = uid; LOCK.tries = 0;
      LOCK.wrap = env.wrap; LOCK.iters = env.iters || 310000;
      DB = JSON.parse(await open_(key, env.data));
      DB.session.userId = uid;
      host.remove();
      if (lockResolve) { const r = lockResolve; lockResolve = null; r(true); }
      else { migrate(); paintShell(); renderNav(); route("dashboard"); armAutoLock(); toast(`${uname(uid)}님, 열렸습니다`); }
    } catch (e) {
      LOCK.tries++; go.disabled = false;
      if (LOCK.tries >= 5) { LOCK.until = Date.now() + 30000; LOCK.tries = 0; err.textContent = "5회 틀렸습니다. 30초 후 다시 시도하세요."; }
      else err.textContent = `비밀번호가 맞지 않습니다. (${LOCK.tries}/5)`;
      pw.select();
    }
  };
  go.onclick = attempt;
  pw.onkeydown = e => { if (e.key === "Enter") attempt(); };
}
function lockGate(rawText) {
  return new Promise(res => { lockResolve = res; lockScreen(JSON.parse(rawText)); });
}
async function lockNow(quiet) {
  if (!LOCK.on || !LOCK.master) return;
  clearTimeout(autoTimer);
  await persistLocal();
  const raw = readRaw();
  if (!raw || !isEnvelope(raw)) { toast("잠글 수 없습니다. 저장 상태를 확인하세요.", true); return; }
  LOCK.master = null; MASTER_RAW = null;
  while (modalStack.length) closeModal();
  $("#view").innerHTML = ""; $("#nav").innerHTML = "";
  DB = null;                                   /* 메모리에서도 비운다 */
  lockScreen(JSON.parse(raw));
  if (!quiet) toast("잠갔습니다");
}
let autoTimer = null;
function armAutoLock() {
  clearTimeout(autoTimer);
  if (!LOCK.on || !LOCK.master || !DB) return;
  const min = Number(DB.church.autoLockMin != null ? DB.church.autoLockMin : 10);
  if (!min) return;
  autoTimer = setTimeout(() => { if (LOCK.on && LOCK.master) lockNow(true).then(() => toast("자리를 비우셔서 자동으로 잠갔습니다")); }, min * 60000);
}
["mousedown", "keydown", "touchstart"].forEach(ev =>
  document.addEventListener(ev, () => { if (LOCK.on && LOCK.master && DB) armAutoLock(); }, { passive: true }));

/* ── 비밀번호 창 ── */
function pwModal(kind, uid) {
  const target = uid ? U(uid) : me();
  const titles = { enable: "잠금 켜기", set: `${target.name} 비밀번호 설정`, change: "내 비밀번호 변경", off: "잠금 끄기" };
  const w = openModal(`
    <div class="modal-head"><div><h2>${esc(titles[kind])}</h2>
      <div class="sub">${kind === "off" ? "확인을 위해 현재 비밀번호를 입력하세요" : "8자 이상 · 숫자와 문자를 섞으면 더 안전합니다"}</div></div></div>
    <div class="modal-body">
      ${kind === "enable" ? `<div class="notice c" style="margin-bottom:14px"><div><b>이 비밀번호를 잊으면 자료를 되살릴 수 없습니다.</b>
        복구용 뒷문을 일부러 두지 않았기 때문입니다. 적어서 교회 금고 같은 안전한 곳에 보관하세요.</div></div>` : ""}
      ${kind === "off" ? `<div class="notice c" style="margin-bottom:14px"><div><b>잠금을 끄면 자료가 암호화되지 않은 채로 저장됩니다.</b>
        파일을 복사해 간 사람이 그대로 열어볼 수 있습니다.</div></div>` : ""}
      ${kind === "set" ? `<div class="notice" style="margin-bottom:14px"><div>정한 비밀번호를 <b>${esc(target.name)}</b>님에게 직접 전달하고, 첫 로그인 후 본인이 바꾸도록 안내하세요.</div></div>` : ""}
      <div class="formgrid">
        ${kind === "change" || kind === "off" ? `<div class="field full"><label for="pw0">현재 비밀번호</label><input type="password" id="pw0" autocomplete="current-password"></div>` : ""}
        ${kind !== "off" ? `<div class="field"><label for="pw1">새 비밀번호</label><input type="password" id="pw1" autocomplete="new-password"></div>
        <div class="field"><label for="pw2">한 번 더</label><input type="password" id="pw2" autocomplete="new-password"></div>` : ""}
      </div>
      <div class="err-msg" id="pwErr" style="margin-top:10px"></div>
    </div>
    <div class="modal-foot"><button class="btn" data-x="c">취소</button>
      <button class="btn btn-primary" data-x="s">${kind === "off" ? "잠금 끄기" : "저장"}</button></div>`, { size: "narrow" });
  w.querySelector('[data-x="c"]').onclick = closeModal;
  w.querySelector('[data-x="s"]').onclick = async () => {
    const err = $("#pwErr");
    const p1 = $("#pw1") ? $("#pw1").value : "", p2 = $("#pw2") ? $("#pw2").value : "", p0 = $("#pw0") ? $("#pw0").value : "";
    if (kind !== "off" && p1.length < 8) { err.textContent = "8자 이상 입력하세요."; return; }
    if (kind !== "off" && p1 !== p2) { err.textContent = "두 번 입력한 비밀번호가 다릅니다."; return; }
    err.textContent = "처리 중…";
    try {
      if (kind === "change" || kind === "off") await tryUnlock(LOCK.user, p0, null);
      if (kind === "enable") await enableLock(p1);
      else if (kind === "off") await disableLock();
      else if (kind === "change") { await setUserPassword(LOCK.user, p1); audit("비밀번호 변경", me().name, "본인 비밀번호 변경"); await persistLocal(); scheduleFolderSave(); }
      else { await setUserPassword(uid, p1); audit("비밀번호 지정", target.name, "관리자가 계정 비밀번호 설정"); await persistLocal(); scheduleFolderSave(); }
      closeModal(); paintShell(); route("settings");
      toast(kind === "off" ? "잠금을 껐습니다" : kind === "enable" ? "잠금을 켰습니다. 이제 비밀번호가 있어야 열립니다." : "비밀번호를 저장했습니다");
    } catch (e) {
      err.textContent = (kind === "change" || kind === "off") ? "현재 비밀번호가 맞지 않습니다." : "처리하지 못했습니다: " + e.message;
    }
  };
}

/* ── 암호화된 백업 파일 복원 ── */
function restoreEnvelope(env, src) {
  const users = (env.users || []).filter(u => u.has);
  const w = openModal(`

/* ══════════════════════════════════════════════════════════
   로그인(아이디·비밀번호) — 위의 "자료 잠금"과는 별개 기능이다.
   자료 잠금은 파일 자체를 암호화해 유출을 막고, 로그인은 앱을 열 때마다
   신원을 확인한다. 비밀번호는 해시로만 저장하며, 관리자(admin.users)가
   잊어버린 계정의 비밀번호를 재설정할 수 있다(자료 잠금과 달리 복구 가능).
   ══════════════════════════════════════════════════════════ */
const SESSION_KEY = "ccms.session";
const DEFAULT_LOGIN_PW = "교회2026!";
async function hashPW(pw, saltB64, iters) {
  iters = iters || 150000;
  const salt = saltB64 ? unb64(saltB64) : CRY.getRandomValues(new Uint8Array(16));
  const base = await CRY.subtle.importKey("raw", TE.encode(pw), "PBKDF2", false, ["deriveBits"]);
  const bits = await CRY.subtle.deriveBits({ name: "PBKDF2", salt, iterations: iters, hash: "SHA-256" }, base, 256);
  return { salt: b64(salt), hash: b64(bits), iters };
}
async function verifyPW(pw, rec) {
  if (!rec || !rec.hash) return false;
  const chk = await hashPW(pw, rec.salt, rec.iters);
  return chk.hash === rec.hash;
}
async function ensureDefaultPasswords() {
  if (!CRY || !DB) return;
  for (const u of DB.users) { if (!u.passHash) u.passHash = await hashPW(DEFAULT_LOGIN_PW); }
}
let loginResolve = null;
function loginScreen(msg) {
  const demoRows = DB.users.map(u => `<tr><td style="white-space:nowrap">${esc(u.name)}<br><span style="color:var(--ink-3);font-size:10px">${esc((DB.roles.find(r => r.id === u.role) || {}).n)}</span></td><td class="num" style="word-break:break-all">${esc(u.email)}</td></tr>`).join("");
  const host = document.createElement("div");
  host.className = "lockwrap"; host.id = "loginWrap";
  host.innerHTML = `
    <div class="lockcard">
      <div class="brand-mark" style="margin:0 auto 14px">敎</div>
      <div style="font-family:var(--serif);font-size:17px;font-weight:700">${esc(DB.church.name)} 관리시스템</div>
      <p style="font-size:12.5px;color:var(--ink-3);margin:6px 0 18px">아이디(이메일)와 비밀번호로 로그인하세요</p>
      <div class="field" style="text-align:left;margin-bottom:10px"><label for="liEmail">아이디(이메일)</label>
        <input type="text" id="liEmail" autocomplete="username" placeholder="pastor@grace.example.kr"></div>
      <div class="field" style="text-align:left"><label for="liPw">비밀번호</label>
        <input type="password" id="liPw" autocomplete="current-password"></div>
      <div class="err-msg" id="liErr" style="min-height:18px;margin-top:6px">${msg ? esc(msg) : ""}</div>
      <button class="btn btn-primary" id="liGo" style="width:100%;justify-content:center;margin-top:6px">로그인</button>
      <details style="text-align:left;margin-top:16px;font-size:11.5px;color:var(--ink-3)">
        <summary style="cursor:pointer;color:var(--ink-2)">데모 계정 안내(실제 운영 전 삭제)</summary>
        <div class="tablewrap" style="margin-top:8px"><table style="font-size:10.5px;width:100%"><thead><tr><th>이름·역할</th><th>아이디</th></tr></thead><tbody>${demoRows}</tbody></table></div>
        <div style="margin-top:6px">공통 초기 비밀번호: <b>${esc(DEFAULT_LOGIN_PW)}</b><br>설정 › 사용자에서 계정별로 재설정하세요.</div>
      </details>
    </div>`;
  document.body.appendChild(host);
  const email = host.querySelector("#liEmail"), pw = host.querySelector("#liPw"), go = host.querySelector("#liGo"), err = host.querySelector("#liErr");
  setTimeout(() => email.focus(), 50);
  let tries = 0, until = 0;
  const attempt = async () => {
    const now = Date.now();
    if (now < until) { err.textContent = `잠시 후 다시 시도하세요 (${Math.ceil((until - now) / 1000)}초)`; return; }
    const idv = email.value.trim(), pv = pw.value;
    if (!idv || !pv) { err.textContent = "아이디와 비밀번호를 입력하세요."; return; }
    go.disabled = true; err.textContent = "확인 중…";
    const u = DB.users.find(x => x.email && x.email.toLowerCase() === idv.toLowerCase() && x.active !== false);
    const ok = u && await verifyPW(pv, u.passHash);
    go.disabled = false;
    if (ok) {
      DB.session.userId = u.id;
      try { sessionStorage.setItem(SESSION_KEY, u.id); } catch (e) { }
      audit("로그인", u.name, "아이디·비밀번호 로그인 성공"); save();
      host.remove();
      if (loginResolve) { const r = loginResolve; loginResolve = null; r(); }
    } else {
      tries++;
      if (u) audit("로그인 실패", u.name, "비밀번호 불일치"); else audit("로그인 실패", idv, "존재하지 않는 아이디");
      save();
      if (tries >= 5) { until = Date.now() + 30000; tries = 0; err.textContent = "5회 틀렸습니다. 30초 후 다시 시도하세요."; }
      else err.textContent = `아이디 또는 비밀번호가 맞지 않습니다. (${tries}/5)`;
      pw.value = ""; pw.focus();
    }
  };
  go.onclick = attempt;
  pw.onkeydown = e => { if (e.key === "Enter") attempt(); };
  email.onkeydown = e => { if (e.key === "Enter") pw.focus(); };
}
function requireLogin() {
  return new Promise(resolve => {
    if (!CRY) return resolve();
    let sid = null;
    try { sid = sessionStorage.getItem(SESSION_KEY); } catch (e) { }
    const su = sid && DB.users.find(u => u.id === sid && u.active !== false);
    if (su) { DB.session.userId = su.id; return resolve(); }
    loginResolve = resolve;
    loginScreen();
  });
}
function logout() {
  audit("로그아웃", me().name, "로그아웃"); save();
  try { sessionStorage.removeItem(SESSION_KEY); } catch (e) { }
  while (modalStack.length) closeModal();
  $("#view").innerHTML = ""; $("#nav").innerHTML = "";
  requireLogin().then(() => { paintShell(); renderNav(); route("dashboard"); armAutoLock(); });
}
function loginPwModal(kind, uid) {

      <div class="sub">8자 이상 · 이 비밀번호는 매번 로그인할 때 사용합니다</div></div></div>
    <div class="modal-body"><div class="formgrid">
      ${kind === "change" ? `<div class="field full"><label for="lp0">현재 비밀번호</label><input type="password" id="lp0" autocomplete="current-password"></div>` : ""}
      <div class="field"><label for="lp1">새 비밀번호</label><input type="password" id="lp1" autocomplete="new-password"></div>

    <div class="modal-foot"><button class="btn" data-x="c">취소</button><button class="btn btn-primary" data-x="s">저장</button></div>`, { size: "narrow" });
  w.querySelector('[data-x="c"]').onclick = closeModal;

    const err = $("#lpErr");

    if (p1 !== p2) { err.textContent = "두 번 입력한 비밀번호가 다릅니다."; return; }
    err.textContent = "처리 중…";
    if (kind === "change") {
      const ok = await verifyPW($("#lp0").value, target.passHash);
      if (!ok) { err.textContent = "현재 비밀번호가 맞지 않습니다."; return; }
    }
    target.passHash = await hashPW(p1);
    audit(kind === "reset" ? "로그인 비밀번호 재설정" : "로그인 비밀번호 변경", target.name, kind === "reset" ? "관리자가 재설정" : "본인이 변경");
    save(); closeModal();
    toast("로그인 비밀번호를 저장했습니다");
    if (CUR === "settings") route("settings");
  };
}
</script>
<script>
/* ══ 백업 ═══════════════════════════════════════════════════ */
async function backupModal() {
  const enc = typeof LOCK !== "undefined" && LOCK.on && LOCK.master;
  const txt = enc ? JSON.stringify(await envelope()) : JSON.stringify(DB, null, 1);
  const fname = enc ? `ccms-backup-${TODAY}.enc.json` : `ccms-backup-${TODAY}.json`;
  const w = openModal(`
    <div class="modal-head"><div><h2>전체 데이터 반출</h2><div class="sub">${enc ? "암호화됨 · AES-256-GCM" : "평문 JSON"} · ${(txt.length / 1024).toFixed(0)}KB</div></div></div>
    <div class="modal-body">
      ${enc ? `<div class="notice a" style="margin-bottom:12px"><div><b>이 파일은 암호문입니다.</b> 비밀번호를 아는 사람만 열 수 있으므로 USB·메일·클라우드에 두어도 비교적 안전합니다.</div></div>`
      : `<div class="notice c" style="margin-bottom:12px"><div><b>개인정보·헌금정보가 그대로 담긴 평문 파일입니다.</b> 설정 › 보안·잠금을 켜면 암호화된 백업으로 바뀝니다. 보관과 폐기 책임은 내려받은 사용자에게 있습니다.</div></div>`}
      <textarea id="bkBox" readonly style="height:220px;font-family:var(--mono);font-size:11px">${esc(txt.slice(0, 20000))}${txt.length > 20000 ? "\n… (미리보기 생략)" : ""}</textarea>
    </div>
    <div class="modal-foot"><button class="btn" data-x="close">닫기</button>
      <button class="btn" data-x="copy">전체 내용 복사</button>
      <button class="btn btn-primary" data-x="dl">JSON 저장</button></div>`, { size: "wide" });
  w.querySelector('[data-x="close"]').onclick = closeModal;
  w.querySelector('[data-x="copy"]').onclick = () => {
    (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject())
      .then(() => toast("전체 백업 내용을 복사했습니다"))
      .catch(() => toast("복사하지 못했습니다. JSON 저장을 사용하세요.", true));
  };
  w.querySelector('[data-x="dl"]').onclick = () => {
    try {
      const b = new Blob([txt], { type: "application/json" });
      const a = document.createElement("a"); a.href = URL.createObjectURL(b); a.download = fname;
      document.body.appendChild(a); a.click(); a.remove();
      toast("저장이 시작되지 않으면 내용을 복사해 사용하세요");
    } catch (e) { toast("이 환경에서는 파일 저장이 차단됩니다", true); }
  };
  audit("데이터 반출", "전체 백업", "JSON 생성"); save();
}

function migrate() {

  if (!DB.enrolls) DB.enrolls = [];
  const ATT_MAP = { "지각": "출석", "온라인": "출석", "공가": "결석" };
  DB.attend.forEach(a => { if (ATT_MAP[a.status]) a.status = ATT_MAP[a.status]; });
  if (!DB.orgs.some(o => o.type === "교육기관")) {
    ["주일학교", "청소년", "청년"].forEach((n, i) => DB.orgs.push({ id: "o-ed" + (i + 1), n, type: "교육기관", leader: "", parent: null }));
    DB.members.forEach(m => {
      const a = age(m.birth);
      const t = a <= 12 ? "o-ed1" : a <= 18 ? "o-ed2" : a <= 34 ? "o-ed3" : null;
      if (t) { m.orgs = m.orgs || []; if (!m.orgs.includes(t)) m.orgs.push(t); }
    });
  }
  ROLE_SEED.forEach(sr => {
    const r = DB.roles.find(x => x.id === sr.id);
    if (r && !r.perms.some(p => p.startsWith("edu."))) r.perms.push(...sr.perms.filter(p => p.startsWith("edu.")));
  });
